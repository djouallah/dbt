version: 2

models:
  - name: fct_price
    description: Regional spot prices from daily AEMO dispatch files (5-minute intervals)
    columns:
      - name: REGIONID
        description: NEM region (plus WA1 for the WA market)
      - name: SETTLEMENTDATE
        description: 5-minute dispatch interval timestamp
      - name: RRP
        description: Regional Reference Price ($/MWh) for the interval
      - name: INTERVENTION
        description: AEMO intervention flag (0 = normal dispatch run)
      - name: file
        description: Source CSV filename the row was ingested from (part of the merge key)
        quote: true          # 'file' is reserved in T-SQL; quote it in generated tests (harmless elsewhere)

  - name: fct_scada
    description: Generation SCADA readings per unit from daily AEMO dispatch files
    columns:
      - name: DUID
        description: Dispatchable Unit Identifier of the generating unit
      - name: SETTLEMENTDATE
        description: 5-minute dispatch interval timestamp
      - name: INITIALMW
        description: Metered output of the unit at the start of the interval (MW)
      - name: file
        description: Source CSV filename the row was ingested from (part of the merge key)
        quote: true

  - name: fct_price_today
    description: Intraday regional spot prices from AEMO 5-minute dispatch files
    columns:
      - name: REGIONID
        description: NEM region (plus WA1 for the WA market)
      - name: SETTLEMENTDATE
        description: 5-minute dispatch interval timestamp
      - name: RRP
        description: Regional Reference Price ($/MWh) for the interval
      - name: file
        description: Source CSV filename the row was ingested from (part of the merge key)
        quote: true

  - name: fct_scada_today
    description: Intraday generation SCADA readings per unit from AEMO dispatch files
    columns:
      - name: DUID
        description: Dispatchable Unit Identifier of the generating unit
      - name: SETTLEMENTDATE
        description: 5-minute dispatch interval timestamp
      - name: INITIALMW
        description: Metered output of the unit at the start of the interval (MW)
      - name: file
        description: Source CSV filename the row was ingested from (part of the merge key)
        quote: true
  # Documented, asserted in exactly one way: tests/assert_fct_summary_grain.sql checks that
  # (date, time, DUID) is unique, and that is the whole contract. The not_null and
  # relationships tests that used to sit on these columns were removed on purpose — the
  # relationships one read dim_duid, and every not_null was a claim about what the source
  # ought to contain. Neither can be re-added without reversing that decision.
  - name: fct_summary
    description: >
      Power BI-facing summary — one row per (date, time, DUID) merging generation (mw)
      with the matching regional price. Rebuilt from the daily facts when new daily files
      land, topped up from the intraday facts in between.
    columns:
      - name: date
        description: Calendar date of the dispatch interval
      - name: time
        description: Dispatch interval time of day encoded as HHMM integer (5-minute grain)
      - name: DUID
        description: Dispatchable Unit Identifier of the generating unit
      - name: mw
        description: Generation for the interval (MW)
      - name: price
        description: Regional Reference Price matched via the unit's region ($/MWh)
      - name: cutoff
        description: High-water mark (max SETTLEMENTDATE seen when the batch was written) used by the intraday top-up branch
