<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capacity units</title>
<!--
  The shell. It holds the stylesheet and three empty elements; `app.js` fills them at load time from
  `history/` on GitHub.

  **Publishing this file is the only thing that needs a Pages deploy.** New run records and a topped-up
  CU ledger arrive as commits to `history/` and the page reads them live, so a measurement no longer
  republishes anything. That is the whole reason this stopped being a Python-rendered static document.

  `#snapshot` is empty here and stays empty on the published page. `build.mjs --snapshot` fills it for
  the offline artifact copy, which has to open from a local disk with no network years later — same
  JavaScript, same render path, data from a different place. `app.js` prefers it when it is present.
-->
<style>
/* One stylesheet, both themes. `prefers-color-scheme` is the default signal; `data-theme` on the root
   wins in both directions if a host stamps one. */
:root { color-scheme: light dark;
  --bg:#fff; --fg:#1a1a1a; --dim:#5b6472; --line:#e3e6ea; --head:#f6f7f9; --sub:#eef1f5;
  --code:#f2f3f5;
  /* Series hue, validated against both surfaces with the dataviz palette validator: lightness band,
     chroma floor and contrast all pass. The dark value is a SELECTED step for the dark surface, not
     an automatic flip of the light one. */
  --series:#2a78d6; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#14171a; --fg:#e8eaed; --dim:#9aa4b2; --line:#2a2f36; --head:#1c2025; --sub:#20252b;
    --code:#22262c; --series:#3987e5; } }
:root[data-theme="dark"] { --bg:#14171a; --fg:#e8eaed; --dim:#9aa4b2; --line:#2a2f36;
  --head:#1c2025; --sub:#20252b; --code:#22262c; --series:#3987e5; }
:root[data-theme="light"] { --bg:#fff; --fg:#1a1a1a; --dim:#5b6472; --line:#e3e6ea; --head:#f6f7f9;
  --sub:#eef1f5; --code:#f2f3f5; --series:#2a78d6; }
* { box-sizing: border-box; }
body { margin:0; padding:2rem 1.25rem 4rem; background:var(--bg); color:var(--fg);
  font:15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
main { max-width: 62rem; margin: 0 auto; }
h2 { font-size:1.5rem; line-height:1.25; margin:0 0 1.25rem; letter-spacing:-0.01em; }
h3 { font-size:1.1rem; margin:2.5rem 0 .85rem; }
h4 { font-size:.95rem; margin:2rem 0 .6rem; color:var(--dim); }
p { margin:.75rem 0; }
a { color:var(--series); text-decoration:none; border-bottom:1px solid var(--line); }
a:hover { border-bottom-color:var(--series); }
p.note { color:var(--dim); font-size:.82rem; line-height:1.5; margin:.7rem 0 0; }
code { background:var(--code); border-radius:4px; padding:.08em .32em; font-size:.88em;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:.5rem 0 .25rem; }
table { border-collapse:collapse; width:100%; font-variant-numeric: tabular-nums; font-size:.92rem; }
th, td { padding:.42rem .7rem; border-bottom:1px solid var(--line); white-space:nowrap; }
thead th { background:var(--head); font-weight:600; font-size:.82rem; letter-spacing:.02em;
  text-transform:lowercase; color:var(--dim); position:sticky; top:0; }
tbody tr.sub td { background:var(--sub); font-weight:600; }
tbody tr:last-child td { border-bottom:none; }
.left { text-align:left; } .right { text-align:right; }
/* A dim annotation, NOT a subscript — `baseline` is what makes it read as a caveat attached to the
   label rather than as notation. It is how "billed, not wall clock" sits on the row it qualifies
   instead of in a note the reader meets four rows later. */
sub { font-size:.78em; color:var(--dim); vertical-align:baseline; margin-left:.45em;
  font-weight:400; }
/* Where the data came from and when — the one thing a live page owes a reader that a rendered
   document did not, since the numbers can now change without the page changing. */
.status { color:var(--dim); font-size:.78rem; margin:0 0 1.5rem; min-height:1.2em; }
.status p { margin:0; }
footer { color:var(--dim); font-size:.78rem; margin-top:3rem; padding-top:1rem;
  border-top:1px solid var(--line); }
/* Charts. The bar is the only thing wearing the series colour — labels and values stay in text ink,
   so identity never depends on being able to see the hue. */
figure.chart { margin:1.25rem 0 1.75rem; }
figure.chart figcaption { display:flex; flex-wrap:wrap; align-items:baseline; gap:.6rem;
  margin-bottom:.35rem; }
.chart-title { font-weight:600; font-size:.95rem; }
.chart-sub { color:var(--dim); font-size:.78rem; }
figure.chart svg { max-width:100%; height:auto; display:block; overflow:visible; }
.bar { fill:var(--series); }
/* Drawn over the bar in the page background colour, so it reads as a range ON the quantity rather
   than as a second series beside it. */
.whisker { stroke:var(--bg); stroke-width:2; opacity:.75; }
.whisker-cap { stroke:var(--bg); stroke-width:2; opacity:.75; }
.bar-label { fill:var(--fg); font-size:12px; font-weight:600; }
.bar-caption { fill:var(--dim); font-size:10px; }
.bar-value { fill:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
.axis { stroke:var(--line); stroke-width:1; }
</style>
</head>
<body>
<main>
  <div class="status" id="status"></div>
  <div id="app"><p class="note">Loading…</p></div>
  <footer id="foot">
    Rendered in your browser from the run records and the CU ledger under
    <code>history/</code>, read at load time — so this page shows the newest measurement without
    being republished. Source and the two workflows that write those files:
    <a href="https://github.com/djouallah/fabric-dbt-benchmark">djouallah/fabric-dbt-benchmark</a>.
  </footer>
</main>
<script id="snapshot" type="application/json"></script>
<script type="module" src="app.js"></script>
</body>
</html>
