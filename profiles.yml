# One profile, four targets. Switch the engine with `dbt run --target <name>`.
# The models are identical within a SQL dialect; only this file and the enabled-gated
# model folders (models/duckdb, models/dwh, models/spark) change per engine.
#
#   duckrun  -> DuckDB executes, delta-rs writes Delta Lake   (default; runs offline)
#   iceberg  -> DuckDB + Iceberg REST catalog on OneLake
#   dwh      -> Fabric Warehouse (T-SQL) via dbt-fabric-samdebruyn
#   spark    -> Fabric Spark (Livy) via dbt-fabricspark, writes Delta
#
# All four read the SAME landed files (the shared download_aemo.py script lands plain
# CSV + csv_raw_archive_log.parquet into a separate landing lakehouse). Point FILES_PATH
# at that landing location. For a quick offline try, use the `duckrun` target with
# ONELAKE_TABLES_PATH and FILES_PATH set to local folders.

aemo_electricity:
  target: duckrun
  outputs:

    # --- DuckDB -> Delta Lake (delta-rs). Local path or abfss:// via ONELAKE_TABLES_PATH.
    duckrun:
      type: duckrun
      schema: "{{ env_var('DBT_SCHEMA', 'mart') }}"
      root_path: "{{ env_var('ONELAKE_TABLES_PATH') }}"

    # --- DuckDB + Iceberg REST catalog on OneLake.
    iceberg:
      type: duckdb
      path: ':memory:'
      database: onelake
      schema: "{{ env_var('DBT_SCHEMA', 'mart') }}"
      threads: 8
      settings:
        preserve_insertion_order: false
      secrets:
        - type: azure
          name: onelake_storage
          provider: access_token
          access_token: "{{ env_var('ONELAKE_TOKEN') }}"
      attach:
        - path: "{{ env_var('WAREHOUSE_PATH') }}"
          alias: onelake
          type: iceberg
          options:
            endpoint: "{{ env_var('ONELAKE_ENDPOINT') }}"
            token: "{{ env_var('ONELAKE_TOKEN') }}"
            access_delegation_mode: 'none'
            stage_create_tables: 0
            skip_create_table_metadata_updates: 1
            default_schema: dbo

    # --- Fabric Warehouse (T-SQL). dbt-fabric-samdebruyn: type stays `fabric`, no ODBC.
    dwh:
      type: fabric
      server: "{{ env_var('FABRIC_DWH_SERVER') }}"
      database: "{{ env_var('FABRIC_DWH_NAME') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'mart') }}"
      workspace_id: "{{ env_var('FABRIC_WORKSPACE_ID', '') }}"
      authentication: "{{ env_var('FABRIC_AUTH', 'CLI') }}"
      tenant_id: "{{ env_var('AZURE_TENANT_ID', '') }}"
      client_id: "{{ env_var('AZURE_CLIENT_ID', '') }}"
      client_secret: "{{ env_var('AZURE_CLIENT_SECRET', '') }}"
      access_token: "{{ env_var('FABRIC_ACCESS_TOKEN', '') }}"
      encrypt: true
      trust_cert: false
      threads: 8
      retries: 1

    # --- Fabric Spark (Livy) via dbt-fabricspark, writes Delta to the Lakehouse.
    spark:
      type: fabricspark
      method: livy
      endpoint: https://api.fabric.microsoft.com/v1
      workspaceid: "{{ env_var('FABRIC_WORKSPACE_ID') }}"
      workspace_name: "{{ env_var('FABRIC_WORKSPACE_NAME', '') }}"   # needed for schema-enabled lakehouse relations
      lakehouseid: "{{ env_var('FABRIC_LAKEHOUSE_ID') }}"
      lakehouse: "{{ env_var('FABRIC_LAKEHOUSE_NAME') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'mart') }}"
      authentication: "{{ env_var('FABRIC_AUTH', 'CLI') }}"
      # 4, not 8: dbt-fabricspark defaults to high_concurrency, which opens one HC session
      # (= one Spark REPL) PER THREAD, and Fabric packs at most five REPLs into one Livy
      # session. 8 threads therefore spilled into a second Livy session — a second Spark
      # application, separately started and separately billed, for one `dbt run`. 4 stays
      # under the cap with a slot spare, since sessionTag packing is a hint and racing
      # acquires can still fan out.
      threads: 4
      connect_retries: 1
      # Deliberately NO session_idle_timeout: setting it forces Fabric to bypass starter pools
      # (cold on-demand cluster, slower startup) and it did NOT stop the observed session
      # deaths anyway — sessions ended at ~35-40 min BUSY, with and without it, so the cap is
      # Fabric-side and not configurable here. The `|| dbt retry` in dbt.yml heals the tail:
      # a fresh process gets a fresh session and re-runs only the failed models.
      # dbt-fabricspark requires spark_config.name (the Livy session/app name).
      # NOTE: compute sizing is NOT configurable from here — Livy API sessions take the WORKSPACE
      # Spark pool settings (the observed "initial executors = 1" launch is the pool's
      # dynamic-allocation floor). To change launch size, change the workspace pool, not this file.
      # `conf` IS delivered — verified with a canary key that read back intact on the master
      # connection AND a packed worker REPL. Neither the adapter nor REPL packing drops it.
      # (`_build_acquire_payload`, concurrent_livy.py:195-228; `conf` is a documented field of
      # HighConcurrencySessionRequest.) What DOES get overridden is an individual key when the
      # resource profile defines it — see below. Read the V-Order bullet in CLAUDE.md before
      # changing anything here.
      #
      # V-ORDER: `vorder.default` IS THE LIVE KEY — the DEPRECATED one is spelled differently.
      # Three near-identical spellings exist and only one is dead:
      #   spark.sql.parquet.vorder.enable   REMOVED in Fabric runtime 1.3+ (migrate away from it)
      #   spark.sql.parquet.vorder.default  what this file sets. Session-level, defaults to FALSE
      #   delta.parquet.vorder.enabled      a TBLPROPERTIES key, table-level, not a session conf
      # Anything claiming "V-Order config is deprecated" is quoting the first one. It is not this.
      #
      # THE PROFILE IS THE LEVER. `spark.sql.parquet.vorder.default` is deliberately NOT set here
      # any more — setting it alone did nothing, and setting it alongside the profile made it
      # impossible to tell which line was doing the work. A Fabric workspace defaults to
      # `spark.fabric.resourceProfile = writeHeavy`, whose definition includes
      # `spark.sql.parquet.vorder.default: "false"`, and the profile is applied AFTER the session
      # conf — so an explicit vorder key is set and then immediately overwritten. It read `false`
      # in-session on every REPL for as long as it stood alone.
      # Measured across three runs, master and worker agreeing every time:
      #     30599066885, 30599860363  no profile set        -> writeHeavy,       vorder=false
      #     30600482604               profile + vorder key  -> readHeavyForPBI,  vorder=true
      # The open question this arrangement answers: does readHeavyForPBI bring vorder=true on its
      # own? It should — the profile defines the key — and if it does, the explicit key was always
      # redundant rather than load-bearing. If a run shows readHeavyForPBI with vorder=false, put
      # the key back BELOW the profile line and say so here.
      #
      # Cost: readHeavyForPBI changes write layout for the whole spark leg, not just V-Order —
      # judge it in the `layout` job of the `dbt` workflow. Upside: this is the same profile the Fabric
      # ENVIRONMENT experiment was built to obtain and REVERTED for costing the starter pool (see
      # CLAUDE.md) — one line here gets it with no environment and no cold-start penalty.
      # If it ever stops being enough: a table property (`+tblproperties:
      # {delta.parquet.vorder.enabled: "true"}`, which the docs say INSERT/UPDATE/MERGE honour, and
      # which is also the key `stats.py` reads); `OPTIMIZE … VORDER` as a post_hook on that one
      # table; or a per-REPL `SET` after session start, which runs after the profile is applied.
      # To re-measure any of this, restore the probe: `git show df1e5ec -- macros/probe_spark_conf.sql`.
      # Never judge it from the Spark UI Environment tab — it shows the launch-time SparkContext
      # conf, not the SparkSession, so it reports nothing either way.
      #
      # BOTH KEYS BELOW ARE NOW DISPATCH INPUTS, and both default to the plain workspace
      # behaviour — so a default run writes writeHeavy layout with NO V-Order, which is what the
      # spark leg did before readHeavyForPBI was set here at all.
      #
      # NATIVE EXECUTION ENGINE (Gluten/Velox): off unless the native_execution_engine input is
      # ticked. `spark.native.enabled` is the whole recipe — Microsoft's current session-level
      # doc sets that one key and nothing else. (Earlier preview guidance, and most community
      # posts, pair it with `spark.shuffle.manager=…ColumnarShuffleManager`; that is not in the
      # current doc, so it is not set here.) It is an EXECUTION change with documented
      # divergences (round(), DECIMAL→FLOAT), so expect small value differences against the
      # other engines while it is on. Not in any resource profile's config set, so the profile
      # cannot clobber it the way it clobbered vorder.default.
      spark_config:
        name: dl_vorder_build
        conf:
          # This line was briefly commented out (37ebff8) to stop forcing readHeavyForPBI; the
          # input below is the same intent, kept selectable. Note the small difference: the key is
          # now always SENT, at writeHeavy, rather than omitted — identical while writeHeavy is the
          # workspace default, and a pin rather than a follow if that default ever changes.
          # writeHeavy is the workspace default and therefore the no-op value. readHeavyForPBI is
          # the ONLY profile that turns V-Order on (readHeavyForSpark does not set vorder at all)
          # and it also flips optimizeWrite with a 1GB bin size, so it rewrites file layout well
          # beyond V-Order — which is why it is now opt-in per dispatch rather than standing.
          # An explicit spark.sql.parquet.vorder.default here is NOT a substitute: the profile is
          # applied after the session conf and overwrote that key for three runs. See CLAUDE.md.
          spark.fabric.resourceProfile: "{{ env_var('SPARK_RESOURCE_PROFILE', 'writeHeavy') }}"
          spark.native.enabled: "{{ env_var('SPARK_NATIVE_ENABLED', 'false') }}"
