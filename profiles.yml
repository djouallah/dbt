# One profile, four targets. Switch the engine with `dbt run --target <name>`.
# The models are identical within a SQL dialect; only this file and the enabled-gated
# model folders (models/duckdb, models/dwh, models/spark) change per engine.
#
#   duckrun  -> DuckDB executes, delta-rs writes Delta Lake   (default; runs offline)
#   iceberg  -> DuckDB + Iceberg REST catalog on OneLake
#   dwh      -> Fabric Warehouse (T-SQL) via dbt-fabric-samdebruyn
#   spark    -> Fabric Spark (Livy) via dbt-fabricspark, writes Delta
#
# All four read the SAME landed files (the shared download_aemo.py script lands plain
# CSV + csv_raw_archive_log.parquet into a separate landing lakehouse). Point FILES_PATH
# at that landing location. For a quick offline try, use the `duckrun` target with
# ONELAKE_TABLES_PATH and FILES_PATH set to local folders.

aemo_electricity:
  target: duckrun
  outputs:

    # --- DuckDB -> Delta Lake (delta-rs). Local path or abfss:// via ONELAKE_TABLES_PATH.
    duckrun:
      type: duckrun
      schema: "{{ env_var('DBT_SCHEMA', 'mart') }}"
      root_path: "{{ env_var('ONELAKE_TABLES_PATH') }}"

    # --- DuckDB + Iceberg REST catalog on OneLake.
    iceberg:
      type: duckdb
      path: ':memory:'
      database: onelake
      schema: "{{ env_var('DBT_SCHEMA', 'mart') }}"
      threads: 8
      settings:
        preserve_insertion_order: false
      secrets:
        - type: azure
          name: onelake_storage
          provider: access_token
          access_token: "{{ env_var('ONELAKE_TOKEN') }}"
      attach:
        - path: "{{ env_var('WAREHOUSE_PATH') }}"
          alias: onelake
          type: iceberg
          options:
            endpoint: "{{ env_var('ONELAKE_ENDPOINT') }}"
            token: "{{ env_var('ONELAKE_TOKEN') }}"
            access_delegation_mode: 'none'
            stage_create_tables: 0
            skip_create_table_metadata_updates: 1
            default_schema: dbo

    # --- Fabric Warehouse (T-SQL). dbt-fabric-samdebruyn: type stays `fabric`, no ODBC.
    dwh:
      type: fabric
      server: "{{ env_var('FABRIC_DWH_SERVER') }}"
      database: "{{ env_var('FABRIC_DWH_NAME') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'mart') }}"
      workspace_id: "{{ env_var('FABRIC_WORKSPACE_ID', '') }}"
      authentication: "{{ env_var('FABRIC_AUTH', 'CLI') }}"
      tenant_id: "{{ env_var('AZURE_TENANT_ID', '') }}"
      client_id: "{{ env_var('AZURE_CLIENT_ID', '') }}"
      client_secret: "{{ env_var('AZURE_CLIENT_SECRET', '') }}"
      access_token: "{{ env_var('FABRIC_ACCESS_TOKEN', '') }}"
      encrypt: true
      trust_cert: false
      threads: 8
      retries: 1

    # --- Fabric Spark (Livy) via dbt-fabricspark, writes Delta to the Lakehouse.
    spark:
      type: fabricspark
      method: livy
      endpoint: https://api.fabric.microsoft.com/v1
      workspaceid: "{{ env_var('FABRIC_WORKSPACE_ID') }}"
      workspace_name: "{{ env_var('FABRIC_WORKSPACE_NAME', '') }}"   # needed for schema-enabled lakehouse relations
      lakehouseid: "{{ env_var('FABRIC_LAKEHOUSE_ID') }}"
      lakehouse: "{{ env_var('FABRIC_LAKEHOUSE_NAME') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'mart') }}"
      authentication: "{{ env_var('FABRIC_AUTH', 'CLI') }}"
      # 4, not 8: dbt-fabricspark defaults to high_concurrency, which opens one HC session
      # (= one Spark REPL) PER THREAD, and Fabric packs at most five REPLs into one Livy
      # session. 8 threads therefore spilled into a second Livy session — a second Spark
      # application, separately started and separately billed, for one `dbt run`. 4 stays
      # under the cap with a slot spare, since sessionTag packing is a hint and racing
      # acquires can still fan out.
      threads: 4
      connect_retries: 1
      # Deliberately NO session_idle_timeout: setting it forces Fabric to bypass starter pools
      # (cold on-demand cluster, slower startup) and it did NOT stop the observed session
      # deaths anyway — sessions ended at ~35-40 min BUSY, with and without it, so the cap is
      # Fabric-side and not configurable here. The `|| dbt retry` in ci.yml heals the tail:
      # a fresh process gets a fresh session and re-runs only the failed models.
      # dbt-fabricspark requires spark_config.name (the Livy session/app name).
      # NOTE: compute sizing is NOT configurable from here — Livy API sessions take the WORKSPACE
      # Spark pool settings (the observed "initial executors = 1" launch is the pool's
      # dynamic-allocation floor). To change launch size, change the workspace pool, not this file.
      # `conf` IS delivered — but the V-Order key below is overwritten before you see it, so do not
      # read this block as working configuration for THAT key. Read the V-Order bullet in CLAUDE.md
      # before changing anything here.
      # The adapter forwards correctly (`_build_acquire_payload`, concurrent_livy.py:195-228, and
      # `conf` is a documented field of HighConcurrencySessionRequest), and probe run 30599860363
      # proved delivery end to end: the made-up `spark.dbt.probe.canary` key reads `alive` on BOTH
      # the master connection and a worker REPL. In the same reading, vorder.default is `false`
      # while resourceProfile is `writeHeavy` — that profile DEFINES vorder.default=false and is
      # applied AFTER the session conf, so it clobbers that key and leaves keys it does not define
      # (the canary) alone. Precedence, not delivery.
      #
      # V-ORDER: `vorder.default` IS THE LIVE KEY — the DEPRECATED one is spelled differently.
      # Three near-identical spellings exist and only one is dead:
      #   spark.sql.parquet.vorder.enable   REMOVED in Fabric runtime 1.3+ (migrate away from it)
      #   spark.sql.parquet.vorder.default  what this file sets. Session-level, defaults to FALSE
      #   delta.parquet.vorder.enabled      a TBLPROPERTIES key, table-level, not a session conf
      # Anything claiming "V-Order config is deprecated" is quoting the first one. It is not this.
      #
      # This line loses a fight it was written to win. A Fabric workspace defaults to
      # `spark.fabric.resourceProfile = writeHeavy`, whose definition includes
      # `spark.sql.parquet.vorder.default: "false"`, and the profile is applied after the session
      # conf. So the key below is set and then immediately overwritten. It has never been in force.
      #
      # WHAT IT WAS BELIEVED TO BUY — RETRACTED. This block used to claim the conf demonstrably
      # V-Ordered every small write (stg_csv_archive_log, dim_duid, fct_price_today,
      # fct_scada_today, all carrying `add.tags {"VORDER": "true"}`) while `mart/fct_summary` came
      # out `tags: {}` on all 19 files — and called that split an unexplained size cutoff. The key
      # never won, so it cannot be the cause of either half: whatever tagged those small writes, it
      # was not this setting, and there is no cutoff to explain.
      # The lever is the PROFILE, not the key. Untested candidate, and the cheapest thing to try
      # next because the canary proves arbitrary keys land: add
      # `spark.fabric.resourceProfile: readHeavyForPBI` to the conf block below and re-read the
      # probe. Unknown whether Fabric reads that key early enough to matter, and it changes write
      # layout for the whole leg — so measure, do not assume. Failing that: a table property
      # (`+tblproperties: {delta.parquet.vorder.enabled: "true"}`, which the docs say INSERT/UPDATE/
      # MERGE honour, and which is also the key `stats.py` reads); `OPTIMIZE … VORDER` as a
      # post_hook on that one table; or a per-REPL `SET` after session start, which runs after the
      # profile is applied and would therefore win. A Fabric ENVIRONMENT with
      # `resourceProfile = readHeavyForPBI` was built for this and REVERTED — see CLAUDE.md for why.
      spark_config:
        name: dl_vorder_build
        conf:
          # The profile is set FIRST here for readability only — a conf block is a dict, not an
          # ordered application sequence, so this does not encode precedence. Whether Fabric reads
          # resourceProfile from a session conf at all is exactly what the probe is measuring.
          # `writeHeavy` (the workspace default) defines vorder.default=false and overwrites the
          # key below; `readHeavyForPBI` is Microsoft's documented profile for V-Order.
          spark.fabric.resourceProfile: "readHeavyForPBI"
          spark.sql.parquet.vorder.default: "true"
          # Canary for macros/probe_spark_conf.sql. A made-up key no resource profile defines. It
          # read `alive` on run 30599860363 on both master and worker, which is what proved `conf`
          # is delivered end to end and that the failure is precedence, not delivery. Kept as the
          # control: if it ever goes `<undefined>`, delivery itself broke. Delete with the probe.
          spark.dbt.probe.canary: "alive"
