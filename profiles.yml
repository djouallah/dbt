# One profile, four targets. Switch the engine with `dbt run --target <name>`.
# The models are identical within a SQL dialect; only this file and the enabled-gated
# model folders (models/duckdb, models/dwh, models/spark) change per engine.
#
#   duckrun  -> DuckDB executes, delta-rs writes Delta Lake   (default; runs offline)
#   iceberg  -> DuckDB + Iceberg REST catalog on OneLake
#   dwh      -> Fabric Warehouse (T-SQL) via dbt-fabric-samdebruyn
#   spark    -> Fabric Spark (Livy) via dbt-fabricspark, writes Delta
#
# All four read the SAME landed files (the shared download_aemo.py script lands plain
# CSV + csv_raw_archive_log.parquet into a separate landing lakehouse). Point FILES_PATH
# at that landing location. For a quick offline try, use the `duckrun` target with
# ONELAKE_TABLES_PATH and FILES_PATH set to local folders.

aemo_electricity:
  target: duckrun
  outputs:

    # --- DuckDB -> Delta Lake (delta-rs). Local path or abfss:// via ONELAKE_TABLES_PATH.
    duckrun:
      type: duckrun
      schema: "{{ env_var('DBT_SCHEMA', 'mart') }}"
      root_path: "{{ env_var('ONELAKE_TABLES_PATH') }}"

    # --- DuckDB + Iceberg REST catalog on OneLake.
    iceberg:
      type: duckdb
      path: ':memory:'
      database: onelake
      schema: "{{ env_var('DBT_SCHEMA', 'mart') }}"
      threads: 8
      settings:
        preserve_insertion_order: false
      secrets:
        - type: azure
          name: onelake_storage
          provider: access_token
          access_token: "{{ env_var('ONELAKE_TOKEN') }}"
      attach:
        - path: "{{ env_var('WAREHOUSE_PATH') }}"
          alias: onelake
          type: iceberg
          options:
            endpoint: "{{ env_var('ONELAKE_ENDPOINT') }}"
            token: "{{ env_var('ONELAKE_TOKEN') }}"
            access_delegation_mode: 'none'
            stage_create_tables: 0
            skip_create_table_metadata_updates: 1
            default_schema: dbo

    # --- Fabric Warehouse (T-SQL). dbt-fabric-samdebruyn: type stays `fabric`, no ODBC.
    dwh:
      type: fabric
      server: "{{ env_var('FABRIC_DWH_SERVER') }}"
      database: "{{ env_var('FABRIC_DWH_NAME') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'mart') }}"
      workspace_id: "{{ env_var('FABRIC_WORKSPACE_ID', '') }}"
      authentication: "{{ env_var('FABRIC_AUTH', 'CLI') }}"
      tenant_id: "{{ env_var('AZURE_TENANT_ID', '') }}"
      client_id: "{{ env_var('AZURE_CLIENT_ID', '') }}"
      client_secret: "{{ env_var('AZURE_CLIENT_SECRET', '') }}"
      access_token: "{{ env_var('FABRIC_ACCESS_TOKEN', '') }}"
      encrypt: true
      trust_cert: false
      threads: 8
      retries: 1

    # --- Fabric Spark (Livy) via dbt-fabricspark, writes Delta to the Lakehouse.
    spark:
      type: fabricspark
      method: livy
      endpoint: https://api.fabric.microsoft.com/v1
      workspaceid: "{{ env_var('FABRIC_WORKSPACE_ID') }}"
      workspace_name: "{{ env_var('FABRIC_WORKSPACE_NAME', '') }}"   # needed for schema-enabled lakehouse relations
      lakehouseid: "{{ env_var('FABRIC_LAKEHOUSE_ID') }}"
      lakehouse: "{{ env_var('FABRIC_LAKEHOUSE_NAME') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'mart') }}"
      authentication: "{{ env_var('FABRIC_AUTH', 'CLI') }}"
      # 4, not 8: dbt-fabricspark defaults to high_concurrency, which opens one HC session
      # (= one Spark REPL) PER THREAD, and Fabric packs at most five REPLs into one Livy
      # session. 8 threads therefore spilled into a second Livy session — a second Spark
      # application, separately started and separately billed, for one `dbt run`. 4 stays
      # under the cap with a slot spare, since sessionTag packing is a hint and racing
      # acquires can still fan out.
      threads: 4
      connect_retries: 1
      # Deliberately NO session_idle_timeout: setting it forces Fabric to bypass starter pools
      # (cold on-demand cluster, slower startup) and it did NOT stop the observed session
      # deaths anyway — sessions ended at ~35-40 min BUSY, with and without it, so the cap is
      # Fabric-side and not configurable here. The `|| dbt retry` in ci.yml heals the tail:
      # a fresh process gets a fresh session and re-runs only the failed models.
      # A published Fabric ENVIRONMENT (`dbt_spark_env`) carries the session profile. The adapter
      # forwards this id as `spark.fabric.environment.id` into both the singleton /sessions POST
      # and the HC acquire (concurrent_livy.py:222), so every REPL this leg opens inherits it.
      # What the environment holds — read it with
      #   GET /v1/workspaces/<ws>/environments/<id>/sparkcompute
      # rather than trusting this comment:
      #   runtimeVersion              2.0     Spark 4.x / Delta 4.x, PUBLIC PREVIEW. See below.
      #   spark.fabric.resourceProfile readHeavyForPBI
      #   spark.native.enabled        true    Native Execution Engine (Velox)
      #   spark.sql.parquet.vorder.default true
      #   optimizeWrite.enabled/binSize true / 1g
      #   dynamicExecutorAllocation   4-9 executors (the pool floor is 1; this raises the launch)
      #
      # THE RESOURCE PROFILE IS THE WHOLE POINT. A Fabric workspace defaults to `writeHeavy`,
      # and that profile *sets* `spark.sql.parquet.vorder.default = false` — so this leg was
      # fighting a profile that explicitly disables the thing it was asking for. `readHeavyForPBI`
      # is the profile whose defaults are V-Order on + optimizeWrite with a 1g bin, which is what
      # a Direct Lake reader wants. Measured before the change: every small write DID carry
      # `add.tags {"VORDER":"true"}` from the session conf alone, but `mart/fct_summary` — 19
      # files, 1.2 GB, the only large write and the only table the benchmark queries — came out
      # untagged, on the same REPL (Thread-2) that had V-Ordered two tables minutes earlier. So
      # the session conf alone was not sufficient and the failure was silent.
      #
      # RUNTIME 2.0 IS THE RISK IN THIS BLOCK. Delta Lake 4.x table features are experimental and
      # Microsoft's own guidance is not to enable them on tables read by other Fabric workloads —
      # which is exactly what `dbt_spark`'s tables are (stats.py reads them through delta-rs, the
      # benchmark reads them through Direct Lake). Nothing here turns a 4.x feature on, and none
      # is on by default, but a protocol bump would break both readers, not just this leg. Drop
      # to "1.3" by PATCHing the environment's staging sparkcompute and re-publishing if either
      # starts failing; the id below does not change.
      #
      # `conf` is forwarded verbatim into the Livy payload and RUNTIME CONF BEATS ENVIRONMENT
      # CONF, so the two lines below are the belt to the environment's braces: they survive the
      # environment failing to attach, which fails silently (V-Order simply stops appearing).
      # dbt-fabricspark requires spark_config.name (the Livy session/app name).
      # NOTE: per-session compute sizing is still NOT settable from this file — the payload's
      # numExecutors/executorCores are forwarded but a Livy API session takes the WORKSPACE pool
      # settings. The environment is now the lever that does work (dynamicExecutorAllocation
      # above); the workspace pool remains the other one.
      environmentId: "{{ env_var('FABRIC_ENVIRONMENT_ID', '608c844f-2381-4526-b482-ce93245103e3') }}"
      spark_config:
        name: dl_vorder_build
        conf:
          spark.sql.parquet.vorder.default: "true"
          spark.fabric.resourceProfile: "readHeavyForPBI"
