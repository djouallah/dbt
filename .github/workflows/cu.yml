name: Capacity CU

# MANUAL ONLY, non-gating, read-only. The third workflow in this repo, and the most disposable.
#
# dbt.yml builds the data; benchmark.yml measures how fast it is to QUERY; this asks what that
# querying COST. Fabric exposes no per-operation CU REST API, so the only authoritative source is
# the Capacity Metrics app's own semantic model, read by DAX.
#
# It shares NOTHING with benchmark.yml — no needs:, no artifact, no concurrency group, no code. It
# reports CU per semantic model from a pinned `since` floor onward. See cu/README.md.
#
# It DOES now separate runs, and note carefully what that is: a run here is a cluster of active hours
# in the metrics model, inferred from idle gaps and identified by its own time window. It is still not
# correlated with a GitHub run id — `benchmark/` records durations but no absolute timestamps, and
# adding them is the coupling this directory exists without.
#
# Run it ~10 minutes AFTER whatever you want to measure: operations land in the metrics model with
# a ~6 minute lag and are smoothed over 5-64 minutes.
on:
  workflow_dispatch:
    inputs:
      since:
        description: "count only from this instant, IN THE MODEL'S CLOCK (the app's own offset, not UTC — the run logs the hour range it saw). A pinned floor, not a rolling window. The default is the first dispatch measured the current way; widen it to reach older suites, whose CU is not comparable. Blank = everything retained (~14 days)."
        type: string
        default: "2026-07-31T16:00:00"
      models:
        description: "semantic models to report, comma-separated and in this order. Blank = every semantic model in the workspace."
        type: string
        default: "aemo_duckrun,aemo_iceberg,aemo_spark,aemo_dwh"
      workspace:
        description: "Fabric workspace GUID the models live in — the same one dbt.yml and benchmark.yml deploy to. Blank = every workspace on the capacity."
        type: string
        default: "ea575278-bd81-459c-9680-47829898c902"
      metrics_workspace_id:
        description: "workspace holding the Fabric Capacity Metrics app"
        type: string
        default: "7f7f5d92-1603-4a02-a46a-0d90fe1ed119"
      metrics_model_id:
        description: "the app's semantic model GUID"
        type: string
        default: "0fdedd3b-1451-4499-9ed4-aa3658100ec1"
      capacity_id:
        description: "capacity GUID (blank = every capacity the metrics model can see)"
        type: string
        default: ""
      run_gap_hours:
        description: "the report splits per RUN on the semantic model's item GUID — every dispatch redeploys, so even two dispatches in the same hour separate. This is the secondary rule, for a model that was NOT redeployed: it splits after this many idle hours. 0 = aggregate only."
        type: string
        default: "2"
      run_ops:
        description: "also break each run down by operation type (off by default — with several runs it is a wall of tables)"
        type: boolean
        default: false
      layout:
        description: "show the physical layout of the mart beside the CU, from the `stats` artifact of the latest successful *dbt* run. Reads no Delta log and spends no capacity — that run already did it."
        type: boolean
        default: true
      layout_table:
        description: "which table's layout to show"
        type: string
        default: "fct_summary"
      debug:
        description: "log the discovered schema and per-timepoint progress to stderr"
        type: boolean
        default: false

# Its OWN group, deliberately not dbt.yml/benchmark.yml's `onelake-<ref>`. Those two share one
# because a wall-clock benchmark cannot absorb capacity contention from a concurrent dbt build.
# This measures nothing timing-sensitive — it reads a semantic model — so making it queue behind a
# five-hour benchmark would only guarantee it runs after the 14-day retention question gets
# interesting. cancel-in-progress: a superseded dispatch has nothing worth finishing.
concurrency:
  group: capacity-cu-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  # To download the `stats` artifact from the latest *dbt* run. Read-only, and the only
  # reason this workflow touches the Actions API at all.
  actions: read

jobs:
  cu:
    name: semantic model CU
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CU_METRICS_WORKSPACE_ID: ${{ inputs.metrics_workspace_id }}
      CU_METRICS_MODEL_ID: ${{ inputs.metrics_model_id }}
      CU_CAPACITY_ID: ${{ inputs.capacity_id }}
      CU_WORKSPACE_FILTER: ${{ inputs.workspace }}
      CU_MODELS: ${{ inputs.models }}
      CU_SINCE: ${{ inputs.since }}
      CU_RUN_GAP_HOURS: ${{ inputs.run_gap_hours }}
      CU_RUN_OPS: ${{ inputs.run_ops }}
      CU_LAYOUT_TABLE: ${{ inputs.layout_table }}
      CU_DEBUG: ${{ inputs.debug }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The whole dependency list. No duckrun, no pythonnet, no ADOMD, no `dotnet publish` — this
      # talks to the Power BI executeQueries REST endpoint, which takes DAX as a JSON string.
      - run: pip install requests

      # Same OIDC federated identity as dbt.yml and benchmark.yml. allow-no-subscriptions because
      # the fabric-github-deploy app is a workspace principal, not an Azure RBAC one.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # PBI_TOKEN is an env var the script reads, minted here from the OIDC service principal.
      # It is NOT a repo secret and none is needed.
      #
      # There was a `secrets.PBI_TOKEN` branch taking precedence when set — written because the
      # community consensus is that a service principal CANNOT read the Capacity Metrics semantic
      # model, so a human's ~1h user token was the planned escape hatch. The SP works (measured,
      # run 30536137179), the branch never fired, and it left two "context access might be
      # invalid" warnings pointing at a secret that deliberately did not exist. If the SP ever
      # does draw a 401/403 here, the hatch is one command:
      #   az account get-access-token --resource https://analysis.windows.net/powerbi/api \
      #     --query accessToken -o tsv
      # and exporting the result as PBI_TOKEN — not a standing secret.
      - name: Acquire a Power BI token
        run: |
          set -euo pipefail
          TOKEN=$(az account get-access-token \
            --resource https://analysis.windows.net/powerbi/api \
            --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "PBI_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # stdout is the markdown table and nothing else; diagnostics are on stderr.
      #
      # tee rather than `>>`: the table lands in the step summary AND in the job log, so a run can
      # be reviewed with `gh run view --log` instead of only in a browser. pipefail because the
      # pipe would otherwise report tee's exit status and turn a failed read green.
      # The layout beside the CU, without reading a single Delta log here: `dbt` workflow's
      # `layout` job already did that and uploaded `stats.json`. Best-effort by construction — no recent
      # run, no artifact, or a 404 leaves STATS_JSON unset and the CU report simply has no layout
      # table. It must never fail this job: a CU report is useful on its own, and the layout is
      # context.
      #
      # The `stats` artifact comes from the `layout` job of the `dbt` workflow, which runs only
      # when all four legs are green — so a SUCCESSFUL dbt run is exactly the set that can carry
      # one. Walk the last few newest-first and take the first that actually has it: a successful
      # run can still lack the artifact (uploaded with continue-on-error, or expired after 90d),
      # and its id would just 404.
      - name: Fetch the layout from the latest dbt run
        if: inputs.layout
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          ids=$(gh run list --workflow dbt.yml --status success -L 5 \
                  --json databaseId -q '.[].databaseId' -R "$GITHUB_REPOSITORY" || true)
          if [ -z "$ids" ]; then
            echo "no successful 'dbt' run to read a layout from" >&2
            exit 0
          fi
          for id in $ids; do
            if gh run download "$id" -n stats -D "$RUNNER_TEMP/stats" -R "$GITHUB_REPOSITORY"; then
              echo "STATS_JSON=$RUNNER_TEMP/stats/stats.json" >> "$GITHUB_ENV"
              echo "layout from dbt run $id" >&2
              exit 0
            fi
            echo "run $id has no 'stats' artifact, trying older" >&2
          done

      - name: Read CU from the Capacity Metrics model
        run: |
          set -o pipefail
          python cu/capacity_cu.py | tee -a "$GITHUB_STEP_SUMMARY"
