name: Capacity CU

# MANUAL ONLY, non-gating, read-only. The third workflow in this repo, and the most disposable.
#
# ci.yml builds the data; benchmark.yml measures how fast it is to QUERY; this asks what that
# querying COST. Fabric exposes no per-operation CU REST API, so the only authoritative source is
# the Capacity Metrics app's own semantic model, read by DAX.
#
# It shares NOTHING with benchmark.yml — no needs:, no artifact, no concurrency group, no code. It
# reports CU per semantic model from a pinned `since` floor onward. See cu/README.md.
#
# It DOES now separate runs, and note carefully what that is: a run here is a cluster of active hours
# in the metrics model, inferred from idle gaps and identified by its own time window. It is still not
# correlated with a GitHub run id — `benchmark/` records durations but no absolute timestamps, and
# adding them is the coupling this directory exists without.
#
# Run it ~10 minutes AFTER whatever you want to measure: operations land in the metrics model with
# a ~6 minute lag and are smoothed over 5-64 minutes.
on:
  workflow_dispatch:
    inputs:
      since:
        description: "count only from this instant, IN THE MODEL'S CLOCK (the app's own offset, not UTC — the run logs the hour range it saw). A pinned floor, not a rolling window. Blank = everything retained (~14 days)."
        type: string
        default: "2026-07-30T22:00:00"
      models:
        description: "semantic models to report, comma-separated and in this order. Blank = every semantic model in the workspace."
        type: string
        default: "aemo_duckrun,aemo_iceberg,aemo_spark,aemo_dwh"
      workspace:
        description: "Fabric workspace GUID the models live in — the same one ci.yml and benchmark.yml deploy to. Blank = every workspace on the capacity."
        type: string
        default: "ea575278-bd81-459c-9680-47829898c902"
      metrics_workspace_id:
        description: "workspace holding the Fabric Capacity Metrics app"
        type: string
        default: "7f7f5d92-1603-4a02-a46a-0d90fe1ed119"
      metrics_model_id:
        description: "the app's semantic model GUID"
        type: string
        default: "0fdedd3b-1451-4499-9ed4-aa3658100ec1"
      capacity_id:
        description: "capacity GUID (blank = every capacity the metrics model can see)"
        type: string
        default: ""
      run_gap_hours:
        description: "split the report per RUN: a new run starts after this many idle hours. The metrics table is bucketed at one HOUR, so two dispatches inside the same hour cannot be separated. 0 = aggregate only."
        type: string
        default: "2"
      run_ops:
        description: "also break each run down by operation type (off by default — with several runs it is a wall of tables)"
        type: boolean
        default: false
      layout:
        description: "show the physical layout of the mart beside the CU, from the `stats` artifact of the latest successful *Parity dashboard* run. Reads no Delta log and spends no capacity — that workflow already did it. Dispatch *Parity dashboard* first if there is no recent run."
        type: boolean
        default: true
      layout_table:
        description: "which table's layout to show"
        type: string
        default: "fct_summary"
      debug:
        description: "log the discovered schema and per-timepoint progress to stderr"
        type: boolean
        default: false

# Its OWN group, deliberately not ci.yml/benchmark.yml's `onelake-<ref>`. Those two share one
# because a wall-clock benchmark cannot absorb capacity contention from a concurrent dbt build.
# This measures nothing timing-sensitive — it reads a semantic model — so making it queue behind a
# five-hour benchmark would only guarantee it runs after the 14-day retention question gets
# interesting. cancel-in-progress: a superseded dispatch has nothing worth finishing.
concurrency:
  group: capacity-cu-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  # To download the `stats` artifact from the latest *Parity dashboard* run. Read-only, and the only
  # reason this workflow touches the Actions API at all.
  actions: read

jobs:
  cu:
    name: semantic model CU
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CU_METRICS_WORKSPACE_ID: ${{ inputs.metrics_workspace_id }}
      CU_METRICS_MODEL_ID: ${{ inputs.metrics_model_id }}
      CU_CAPACITY_ID: ${{ inputs.capacity_id }}
      CU_WORKSPACE_FILTER: ${{ inputs.workspace }}
      CU_MODELS: ${{ inputs.models }}
      CU_SINCE: ${{ inputs.since }}
      CU_RUN_GAP_HOURS: ${{ inputs.run_gap_hours }}
      CU_RUN_OPS: ${{ inputs.run_ops }}
      CU_LAYOUT_TABLE: ${{ inputs.layout_table }}
      CU_DEBUG: ${{ inputs.debug }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The whole dependency list. No duckrun, no pythonnet, no ADOMD, no `dotnet publish` — this
      # talks to the Power BI executeQueries REST endpoint, which takes DAX as a JSON string.
      - run: pip install requests

      # Same OIDC federated identity as ci.yml and benchmark.yml. allow-no-subscriptions because
      # the fabric-github-deploy app is a workspace principal, not an Azure RBAC one.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # The script only ever reads PBI_TOKEN, so there is one code path whether the token came
      # from the service principal or from a human.
      #
      # Service principals are widely reported NOT to work against the Capacity Metrics semantic
      # model specifically. If the SP draws a 401/403, set a PBI_TOKEN repo secret to a user token
      # (`az account get-access-token --resource https://analysis.windows.net/powerbi/api
      # --query accessToken -o tsv`) and it takes precedence here. Such a token expires in ~1 hour,
      # so it is a per-investigation thing, not a standing secret.
      - name: Acquire a Power BI token
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.PBI_TOKEN }}" ]; then
            echo "using the PBI_TOKEN secret (user token)" >&2
            TOKEN='${{ secrets.PBI_TOKEN }}'
          else
            echo "using the OIDC service principal" >&2
            TOKEN=$(az account get-access-token \
              --resource https://analysis.windows.net/powerbi/api \
              --query accessToken -o tsv)
          fi
          echo "::add-mask::$TOKEN"
          echo "PBI_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # stdout is the markdown table and nothing else; diagnostics are on stderr.
      #
      # tee rather than `>>`: the table lands in the step summary AND in the job log, so a run can
      # be reviewed with `gh run view --log` instead of only in a browser. pipefail because the
      # pipe would otherwise report tee's exit status and turn a failed read green.
      # The layout beside the CU, without reading a single Delta log here: the *Parity dashboard*
      # workflow already did that and uploaded `stats.json`. Best-effort by construction — no recent
      # run, no artifact, or a 404 leaves STATS_JSON unset and the CU report simply has no layout
      # table. It must never fail this job: a CU report is useful on its own, and the layout is
      # context.
      #
      # `--name stats` off the latest SUCCESSFUL run of that workflow, not this repo's newest run of
      # anything — a failed dashboard has no artifact and its run id would just 404.
      - name: Fetch the layout from the latest Parity dashboard run
        if: inputs.layout
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          id=$(gh run list --workflow "Parity dashboard" --status success -L 1 \
                 --json databaseId -q '.[0].databaseId' -R "$GITHUB_REPOSITORY" || true)
          if [ -z "$id" ]; then
            echo "no successful 'Parity dashboard' run to read a layout from — dispatch it once" >&2
            exit 0
          fi
          if gh run download "$id" -n stats -D "$RUNNER_TEMP/stats" -R "$GITHUB_REPOSITORY"; then
            echo "STATS_JSON=$RUNNER_TEMP/stats/stats.json" >> "$GITHUB_ENV"
            echo "layout from Parity dashboard run $id" >&2
          else
            echo "run $id has no 'stats' artifact (expired after 90d, or it failed before upload)" >&2
          fi

      - name: Read CU from the Capacity Metrics model
        run: |
          set -o pipefail
          python cu/capacity_cu.py | tee -a "$GITHUB_STEP_SUMMARY"
