name: Capacity units

# MANUAL ONLY, non-gating, read-only. The third workflow in this repo, and the most disposable.
#
# dbt.yml builds the data; benchmark.yml measures how fast it is to QUERY; this asks what both of
# them COST. Fabric exposes no per-operation CU REST API, so the only authoritative source is
# the Capacity Metrics app's own semantic model, read by DAX.
#
# It reports every item in the workspace, split into ETL (the lakehouses, the warehouse, the
# notebooks and Livy sessions that WRITE the tables) and analytics (the semantic models that are
# QUERIED) — per operation type, and per run. `etl: false` narrows it back to the semantic models.
#
# It shares NOTHING with benchmark.yml — no needs:, no artifact, no concurrency group, no code. It
# reports capacity units per engine from a pinned `since` floor onward. See cu/README.md.
#
# Output lands in four places, all from ONE run of the script: the job summary (markdown), the job
# log, a `cu-report` artifact, and GitHub Pages — https://djouallah.github.io/fabric-dbt-benchmark/, which is the
# LATEST report and nothing else. Each dispatch overwrites it; the artifact is the per-run copy.
#
# The repo is PUBLIC, so that page is public. It carries capacity-unit totals per engine and item
# names — no tokens, no ids, no data — but it is public, deliberately and with that understood.
#
# It DOES now separate runs, and note carefully what that is: a run here is a cluster of active hours
# in the metrics model, inferred from idle gaps and identified by its own time window. It is still not
# correlated with a GitHub run id — `benchmark/` records durations but no absolute timestamps, and
# adding them is the coupling this directory exists without.
#
# Run it ~10 minutes AFTER whatever you want to measure: operations land in the metrics model with
# a ~6 minute lag and are smoothed over 5-64 minutes.
on:
  # Callable from `all.yml`, which is the ordinary way this runs: build → benchmark → lag → measure,
  # one dispatch. The inputs mirror the dispatch ones below, minus the `type: choice` (a
  # `workflow_call` input can only be string / boolean / number, so a choice arrives as a string).
  #
  # `history` exists ONLY here and is off by default: a standalone dispatch measures whatever window
  # it was handed, which is not a generation, and filing it as one would poison `history/` with
  # records that mean something else.
  workflow_call:
    inputs:
      since: { type: string, required: false, default: "2026-08-01T10:00:00" }
      etl: { type: boolean, required: false, default: true }
      models: { type: string, required: false, default: "aemo_duckrun,aemo_iceberg,aemo_spark,aemo_dwh" }
      workspace: { type: string, required: false, default: "" }
      metrics_workspace_id: { type: string, required: false, default: "" }
      metrics_model_id: { type: string, required: false, default: "" }
      capacity_id: { type: string, required: false, default: "" }
      run_gap_hours: { type: string, required: false, default: "2" }
      run_ops: { type: boolean, required: false, default: false }
      layout: { type: boolean, required: false, default: true }
      layout_table: { type: string, required: false, default: "fct_summary" }
      refresh: { type: boolean, required: false, default: true }
      debug: { type: boolean, required: false, default: false }
      history: { type: boolean, required: false, default: false }
  workflow_dispatch:
    inputs:
      since:
        description: "count only from this instant, IN THE MODEL'S CLOCK (the app's own offset, +10, not UTC — the run logs the hour range it saw). A pinned floor, not a rolling window. The default is the from-scratch dbt run of 2026-08-01 (30676635835), which reset every output item, so anything earlier belongs to items that no longer exist. Widen it to reach those anyway. Blank = everything retained (~14 days)."
        type: string
        default: "2026-08-01T10:00:00"
      etl:
        description: "report EVERY item in the workspace — lakehouses, the warehouse, notebooks, Livy sessions — classified into etl and analytics, not just the semantic models. With this on, `models` below stops filtering and only orders."
        type: boolean
        default: true
      models:
        description: "semantic models to lead the report, comma-separated and in this order; they are printed even with no activity, so a 0.0 says 'deployed, never queried'. With `etl` off this is also a FILTER. Blank = order by CU."
        type: string
        default: "aemo_duckrun,aemo_iceberg,aemo_spark,aemo_dwh"
      workspace:
        description: "Fabric workspace GUID the items live in — the same one dbt.yml and benchmark.yml deploy to. With `etl` on this is the ONLY filter, which is the right one to be left with: everything in there is this repo's. Blank = the FABRIC_WORKSPACE_ID repo secret, and only if that is unset too, every workspace on the capacity."
        type: string
        default: ""
      metrics_workspace_id:
        description: "workspace holding the Fabric Capacity Metrics app. Blank = the CU_METRICS_WORKSPACE_ID repo secret, which is where it normally comes from."
        type: string
        default: ""
      metrics_model_id:
        description: "the app's semantic model GUID. Blank = the CU_METRICS_MODEL_ID repo secret."
        type: string
        default: ""
      capacity_id:
        description: "capacity GUID. Blank falls back to the CU_CAPACITY_ID secret, and only if that is unset too does it query every capacity the metrics model can see — which costs an extra DAX query to enumerate them plus two more per capacity beyond the first."
        type: string
        default: ""
      run_gap_hours:
        description: "the report splits per RUN on the semantic model's item GUID — every dispatch redeploys, so even two dispatches in the same hour separate. This is the secondary rule, and it is what separates the ETL items, whose GUIDs outlive every run: it splits after this many idle hours. 0 = aggregate only."
        type: string
        default: "2"
      run_ops:
        description: "also break each run down by operation type (off by default — with several runs it is a wall of tables)"
        type: boolean
        default: false
      layout:
        description: "show the physical layout of the mart beside the CU, from the `stats` artifact of the latest successful *dbt* run. Reads no Delta log and spends no capacity — that run already did it."
        type: boolean
        default: true
      layout_table:
        description: "which table's layout to show"
        type: string
        default: "fct_summary"
      refresh:
        description: "refresh the Capacity Metrics semantic model and wait for it before querying — a dispatch creates items the app has not seen yet. Turn off only to re-read a settled window."
        type: boolean
        default: true
      debug:
        description: "log the discovered schema and per-timepoint progress to stderr"
        type: boolean
        default: false

# Its OWN group, deliberately not dbt.yml/benchmark.yml's `onelake-<ref>`. Those two share one
# because a wall-clock benchmark cannot absorb capacity contention from a concurrent dbt build.
# This measures nothing timing-sensitive — it reads a semantic model — so making it queue behind a
# five-hour benchmark would only guarantee it runs after the 14-day retention question gets
# interesting. cancel-in-progress: a superseded dispatch has nothing worth finishing.
concurrency:
  group: capacity-cu-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  # To download the `stats` artifact from the latest *dbt* run. Read-only, and the only
  # reason this workflow touches the Actions API at all.
  actions: read
  # To publish the report to Pages. Only the `publish` job actually uses it.
  pages: write

jobs:
  cu:
    name: capacity units
    runs-on: ubuntu-latest
    # Spelled out per job rather than inherited, because this one needs `contents: write` to commit
    # the history record — and a job-level block REPLACES the workflow-level one, so every scope the
    # job uses has to be listed. `publish` below keeps the workflow-level set.
    permissions:
      id-token: write
      contents: write
      actions: read
    # 45, not 20: the pre-query refresh of the metrics model waits up to CU_REFRESH_TIMEOUT (15
    # min) before giving up. The read itself is six DAX queries, or three with the capacity pinned
    # — the "~60 sequential timepoint requests" this comment used to cite belonged to the deleted
    # timepoint-detail design.
    timeout-minutes: 45
    env:
      # Same secret-fallback shape as the workspace below: no GUID is written into this repo, the
      # input `default:` cannot hold one (a default takes no context), and `capacity_cu.py` keeps
      # no default either — it dies if both are unset rather than guessing at a model.
      CU_METRICS_WORKSPACE_ID: ${{ inputs.metrics_workspace_id || secrets.CU_METRICS_WORKSPACE_ID }}
      CU_METRICS_MODEL_ID: ${{ inputs.metrics_model_id || secrets.CU_METRICS_MODEL_ID }}
      # Falls back to a SECRET, so the capacity GUID is not written down in this repo. Pinning it is
      # not only about that: unpinned, the script must first ask the model which capacities exist
      # and then read items + CU for each, so this tenant's two turn 3 DAX queries into 6. Against a
      # metrics model on SHARED capacity — where the REST budget is what throttled the service
      # principal in the first place — halving the request count is the point.
      CU_CAPACITY_ID: ${{ inputs.capacity_id || secrets.CU_CAPACITY_ID }}
      # Blank input -> the FABRIC_WORKSPACE_ID SECRET, so the GUID is not written into this
      # repo. It cannot be defaulted on the input itself (a `default:` takes no context) nor
      # passed down from all.yml (`jobs.<id>.with` is the one place `secrets` is NOT
      # available), so every called workflow resolves it here, for itself.
      CU_WORKSPACE_FILTER: ${{ inputs.workspace || secrets.FABRIC_WORKSPACE_ID }}
      CU_MODELS: ${{ inputs.models }}
      CU_ETL: ${{ inputs.etl && '1' || '0' }}
      CU_SINCE: ${{ inputs.since }}
      CU_RUN_GAP_HOURS: ${{ inputs.run_gap_hours }}
      CU_RUN_OPS: ${{ inputs.run_ops }}
      CU_LAYOUT_TABLE: ${{ inputs.layout_table }}
      CU_REFRESH: ${{ inputs.refresh && '1' || '0' }}
      CU_DEBUG: ${{ inputs.debug }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The whole dependency list. No duckrun, no pythonnet, no ADOMD, no `dotnet publish` — this
      # talks to the Power BI executeQueries REST endpoint, which takes DAX as a JSON string.
      # pytest is for the offline suite below and nothing else imports it.
      - run: pip install requests pytest

      # Free, offline, no token, ~2s. It runs BEFORE the Azure login on purpose: everything it
      # covers — the run split, the class rollup, the fold, the empty-report diagnosis — is pure
      # post-processing of rows already in hand, so a break in it is worth catching before the job
      # goes near the capacity.
      - name: Test the report layer offline
        run: python -m pytest cu/ -q

      # Same OIDC federated identity as dbt.yml and benchmark.yml. allow-no-subscriptions because
      # the fabric-github-deploy app is a workspace principal, not an Azure RBAC one.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # PBI_TOKEN is an env var the script reads, minted here from the OIDC service principal.
      # It is NOT a repo secret and none is needed.
      #
      # There was a `secrets.PBI_TOKEN` branch taking precedence when set — written because the
      # community consensus is that a service principal CANNOT read the Capacity Metrics semantic
      # model, so a human's ~1h user token was the planned escape hatch. The SP works (measured,
      # run 30536137179), the branch never fired, and it left two "context access might be
      # invalid" warnings pointing at a secret that deliberately did not exist. If the SP ever
      # does draw a 401/403 here, the hatch is one command:
      #   az account get-access-token --resource https://analysis.windows.net/powerbi/api \
      #     --query accessToken -o tsv
      # and exporting the result as PBI_TOKEN — not a standing secret.
      - name: Acquire a Power BI token
        run: |
          set -euo pipefail
          TOKEN=$(az account get-access-token \
            --resource https://analysis.windows.net/powerbi/api \
            --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "PBI_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # A SECOND token, on a different audience, for naming items only — see fabric_items().
      # The datasets endpoint PBI_TOKEN reaches lists semantic models and nothing else, so without
      # this every lakehouse, warehouse and notebook depends on the metrics app's 'Items' snapshot,
      # which lags exactly where it matters: a `duckrun-py-*` notebook created by the run being
      # measured is not in it yet, and an unnamed item cannot be classified as ETL.
      #
      # continue-on-error, and the script degrades rather than fails: a report that names most items
      # beats no report. It is the same OIDC login, so a failure here means the SP's Fabric access
      # changed, not that a secret is missing.
      - name: Acquire a Fabric token (item names only)
        continue-on-error: true
        run: |
          set -euo pipefail
          TOKEN=$(az account get-access-token \
            --resource https://api.fabric.microsoft.com \
            --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "FABRIC_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # stdout is the markdown table and nothing else; diagnostics are on stderr.
      #
      # tee rather than `>>`: the table lands in the step summary AND in the job log, so a run can
      # be reviewed with `gh run view --log` instead of only in a browser. pipefail because the
      # pipe would otherwise report tee's exit status and turn a failed read green.
      # The layout beside the CU, without reading a single Delta log here: `dbt` workflow's
      # `layout` job already did that and uploaded `stats.json`. Best-effort by construction — no recent
      # run, no artifact, or a 404 leaves STATS_JSON unset and the CU report simply has no layout
      # table. It must never fail this job: a CU report is useful on its own, and the layout is
      # context.
      #
      # The `stats` artifact comes from the `layout` job of `dbt.yml`, which runs only when all four
      # legs are green — so a SUCCESSFUL run is exactly the set that can carry one.
      #
      # THIS RUN COMES FIRST, and that is the fix for a real miss. `dbt.yml` usually runs as a
      # `workflow_call` FROM `all.yml`, and a called workflow does not get a run of its own: the run
      # belongs to the caller and its artifacts are uploaded there. So `gh run list --workflow
      # dbt.yml` cannot see the build that just happened — it lists only standalone `dbt` dispatches
      # — and on run 30685959678 it reached past this run's own build to the last standalone one
      # (30676635835), whose stats predated the `config` block. The page then printed "not recorded
      # by dbt run 30676635835" beside CU that a 64-vCore run had produced: a stale id, and the
      # hardware section blank for exactly the dispatch that had chosen the hardware. When called
      # from `all.yml` the build's artifact is on $GITHUB_RUN_ID, so try that before anything else.
      #
      # Then both workflows, newest-first within each. A successful run can still lack the artifact
      # (uploaded with continue-on-error, or expired after 90d) and its id would just 404, so walk
      # until one downloads. Best-effort by construction — no run, no artifact, or a 404 leaves
      # STATS_JSON unset and the report simply has no layout table. It must never fail this job.
      - name: Fetch the layout from this run, else the latest dbt build
        if: inputs.layout
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          ids="$GITHUB_RUN_ID"
          for wf in all.yml dbt.yml; do
            ids="$ids $(gh run list --workflow "$wf" --status success -L 5 \
                          --json databaseId -q '.[].databaseId' -R "$GITHUB_REPOSITORY" || true)"
          done
          for id in $ids; do
            if gh run download "$id" -n stats -D "$RUNNER_TEMP/stats" -R "$GITHUB_REPOSITORY"; then
              echo "STATS_JSON=$RUNNER_TEMP/stats/stats.json" >> "$GITHUB_ENV"
              echo "layout from run $id" >&2
              exit 0
            fi
            echo "run $id has no 'stats' artifact, trying next" >&2
          done
          echo "no run carried a 'stats' artifact — no layout table" >&2

      # ONE read of the metrics model, three copies of its output: `cu-report.md` for the page and
      # the artifact, the step summary, and the job log (so `gh run view --log` shows it too).
      # pipefail because the pipe would otherwise report tee's exit status and turn a failed read
      # green.
      # Timestamp-first so `history/` sorts chronologically in a directory listing, with the run id
      # after it so a record can always be traced back to the run that wrote it. Computed in a step
      # rather than at job level: a job-level `env` and a step-set one resolve in an order that is
      # easy to get wrong, and this one decides whether a file is written at all.
      - name: Name this generation's history record
        id: hist
        if: inputs.history
        run: echo "path=history/$(date -u +%Y-%m-%dT%H%MZ)-${{ github.run_id }}.json" >> "$GITHUB_OUTPUT"

      - name: Read CU from the Capacity Metrics model
        env:
          CU_HISTORY_JSON: ${{ steps.hist.outputs.path }}
        run: |
          set -o pipefail
          python cu/capacity_cu.py | tee cu-report.md | tee -a "$GITHUB_STEP_SUMMARY"

      # Markdown -> one self-contained HTML file. No network at render time and none at view time:
      # the CSS is inline and there is no script, font or image, so the artifact copy opens off a
      # local disk years later.
      - name: Render the report as a page
        run: |
          set -euo pipefail
          mkdir -p site
          python cu/report_html.py cu-report.md \
            "Fabric capacity units, read from the Capacity Metrics app's semantic model by \
             \`cu/capacity_cu.py\`. Published by the \`Capacity units\` workflow, run \
             ${{ github.run_id }} (\`${{ github.sha }}\`). Each dispatch replaces this page; the \
             per-run copy is that run's \`cu-report\` artifact." > site/index.html

      # The per-run copy. Pages only ever holds the latest, and a report is worth comparing against
      # an older one.
      - uses: actions/upload-artifact@v4
        with:
          name: cu-report
          path: |
            cu-report.md
            site/index.html
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # The only storage here that outlives retention. Artifacts expire (90 days, the Pages one
      # sooner) and the Capacity Metrics model keeps ~14 days, so without this every number measured
      # is gone within a fortnight.
      #
      # Committing from CI is safe in THIS repo precisely because nothing runs on push — that
      # standing rule is what stops a bot commit from starting a paid build. If any workflow is ever
      # given a `push:` trigger, revisit this step in the same change.
      #
      # `pull --rebase` because a queued dispatch can have moved main since checkout; `|| exit 0` on
      # the diff check because a re-run that produces an identical record must not fail the job.
      - name: Commit the history record
        if: inputs.history && steps.hist.outputs.path != ''
        run: |
          set -euo pipefail
          test -f "${{ steps.hist.outputs.path }}" || { echo "no record written — nothing to commit" >&2; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.hist.outputs.path }}"
          git diff --cached --quiet && { echo "record identical to HEAD" >&2; exit 0; }
          git commit -m "history: capacity units for run ${{ github.run_id }}"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

  # Separate job because `deploy-pages` needs the `github-pages` environment, and a deployment
  # environment on the job that holds the Fabric tokens would put an approval gate in front of the
  # capacity read rather than in front of the publish. It runs only when the read succeeded — a
  # failed dispatch must not overwrite a good page with a half-written one.
  publish:
    name: publish the page
    needs: cu
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
