name: Table layout

# MANUAL ONLY. `stats.py` over all four engines: row-count parity plus physical layout, read from
# each item's Delta log on OneLake. This was the `summary` job of ci.yml and is now its own workflow.
#
# WHY IT MOVED: **it takes ~10 minutes and it answers a question whose answer rarely changes.** The
# iceberg item alone has been observed at 12m+ (386 files, 1,175 row groups — that is the cost of
# reading its Delta log over OneLake), which is why the timeout here is 40 and not 15. Meanwhile the
# thing it reports — files, row groups, size, v-order per engine — only moves when the tables are
# REWRITTEN, and the facts are append-only incrementals: an ordinary run adds a few files. So charging
# every `dbt` dispatch ten minutes to re-read four Delta logs was paying, per build, for numbers that
# had not moved since the last build. Dispatch it when you want the current layout.
#
# Two things fell out of moving it, both of which make the split worth more than the ten minutes:
#
#   1. **It is now runnable WITHOUT a build.** The dashboard is a question about the current state of
#      four lakehouses, not about the run that happened to write them; asking it used to mean spending
#      four Fabric legs first.
#   2. **Its result is now reusable, and being near-static is exactly what makes that safe.** `cu/`
#      prints the layout beside the CU by downloading this workflow's `stats` artifact — a cached
#      reading is fine precisely because the layout does not change between builds. A step summary
#      inside a bigger run could not serve that: stdout is redirected so it never reaches the job log,
#      and GitHub exposes no REST endpoint for a summary, so it was readable by a human on that page
#      and by nothing else.
#
# THE COST, stated plainly: **`dbt` no longer ends with a cross-engine check.** Every leg tests its own
# output in its own `dbt build`, and no test compares one engine to another — so this dashboard is the
# ONLY thing in the repo that puts the four side by side. It used to run automatically after a green
# build; now nobody sees a parity difference until someone dispatches this. Dispatch it after a `dbt`
# run you care about.
#
# And because it is manual it can be dispatched at ANY time, including mid-build — in which case it
# reads four lakehouses in whatever half-written state they are in and reports drift that is really
# just a build in flight. `dbt` and this share a concurrency group so a dispatch QUEUES behind a build
# rather than racing it; that handles the common case, not a Fabric-side notebook still finishing after
# its GitHub job has gone green.
#
# It only READS. No table is written, nothing is provisioned, no capacity is consumed beyond the
# OneLake reads of eight tables' Delta logs per item.
on:
  workflow_dispatch:
    inputs:
      workspace:
        description: "Fabric workspace GUID"
        type: string
        default: "ea575278-bd81-459c-9680-47829898c902"

# SHARED with ci.yml (and benchmark.yml) on purpose: a dashboard dispatched during a build reads
# half-written tables and calls it drift. Not cancel-in-progress — a queued dispatch is exactly the
# behaviour wanted here.
concurrency:
  group: onelake-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  layout:
    name: table layout
    runs-on: ubuntu-latest
    # get_stats() over OneLake is slow on the iceberg item (12m+ observed for that one engine);
    # 15 minutes was cancelling stats.py mid-table and turning slowness into a red run.
    timeout-minutes: 40
    env:
      WS_ID: ${{ inputs.workspace }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install duckrun requests

      # `tee`, and STATS_JSON, so this step's result is not trapped on the run page: the markdown lands
      # in the step summary AND the job log, and the same numbers land in stats.json for `cu/`.
      # pipefail so a failed read cannot come out green through tee.
      - name: Parity + layout dashboard
        env:
          STATS_JSON: ${{ github.workspace }}/stats.json
        run: |
          set -o pipefail
          python .github/scripts/stats.py | tee -a "$GITHUB_STEP_SUMMARY"

      # The reusable half. `cu/` downloads this from the latest successful run of this workflow; a
      # missing artifact only costs it the layout table, which degrades to a note.
      - name: Upload stats.json
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: stats
          path: stats.json
          if-no-files-found: warn
