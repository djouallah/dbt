name: dbt

# land once -> `dbt build` the same models on 4 engines in Fabric -> report. Compute is always
# Fabric; the runner only downloads and drives.
#
# Each leg tests its own output, in the same invocation that wrote it: `dbt build` interleaves
# model and test, so a test failure stops that leg at the node that broke rather than surfacing a
# run later. All four legs run the same six assertions — the singular suite is written per dialect
# (tests/duckdb, tests/dwh, tests/spark) and gated per folder in dbt_project.yml, the same way
# models/ is. What is gone is the neutral reader: no test compares one engine to another, so a
# green leg means that engine is self-consistent and nothing more. The mart parity table is the only
# cross-engine signal there is, and the `layout` job at the bottom runs it as the last step of the
# build — gated on all four legs being green, since a table with holes in it reads as drift that
# isn't there. It costs ~10 minutes of OneLake reads (iceberg alone 12m+) per dispatch to report
# numbers that only move when the tables are rewritten; that is what the build pays for ending
# with a cross-engine check instead of nobody noticing drift until someone remembers to look.
# There is no standalone copy any more: `Table layout` (workflows/table-layout.yml) was deleted,
# so this job is the only producer of the parity table and of the `stats` artifact `cu/` reads.
#
# This comment used to say dwh and spark were "graded by their generic column tests alone". They
# were graded by nothing: the gate sat on the project key, which also matches generic tests (their
# fqn has no folder segment), so `dbt build --target dwh` ran zero tests. See CLAUDE.md.

# DISPATCH ONLY — deliberately no `push:` trigger. Every run lands four Fabric legs on paid
# capacity, so a push-triggered build meant that any code change, including one that only touched a
# script or a workflow file, spent compute nobody had asked for. During a batch of edits that is
# several runs racing each other on the concurrency group, and cancelling them does not stop the
# Fabric-side notebook or Livy session anyway (see `permissions` below).
#
# `paths-ignore: ['**.md', 'LICENSE']` used to soften this, but it is per-PUSH, not per-file: a
# commit touching a doc AND anything else still ran. It was not a cost control.
#
# Run it with `gh workflow run dbt` (or the Actions UI) when a build is actually wanted.
on:
  # Callable from `all.yml`, which is the ordinary way this runs. The inputs mirror the dispatch ones
  # below; `cores` and `spark_resource_profile` arrive as plain strings because a `workflow_call`
  # input cannot be a `choice`, so the dropdown exists on the dispatch form only. An invalid value
  # therefore fails at the leg rather than at the form — the defaults are the same either way.
  workflow_call:
    inputs:
      workspace: { type: string, required: false, default: "ea575278-bd81-459c-9680-47829898c902" }
      download_limit: { type: string, required: false, default: "200" }
      cores: { type: string, required: false, default: "8" }
      native_execution_engine: { type: boolean, required: false, default: false }
      spark_resource_profile: { type: string, required: false, default: "writeHeavy" }
      reset_outputs: { type: boolean, required: false, default: false }
  workflow_dispatch:
    inputs:
      workspace:
        description: "Fabric workspace GUID"
        type: string
        default: "ea575278-bd81-459c-9680-47829898c902"
      download_limit:
        description: "files to download per source"
        type: string
        default: "200"
      cores:
        description: "Fabric Python-notebook vCores"
        type: choice
        options: ["4", "8", "16", "32", "64"]
        default: "8"
      # `rebuild_summary` was removed. The dwh model still honours REBUILD_SUMMARY /
      # `--vars 'rebuild_summary: true'` by hand; nothing in CI sets it.
      native_execution_engine:
        description: "spark leg only: Fabric Native Execution Engine (NEE)"
        type: boolean
        default: false
      spark_resource_profile:
        description: "spark leg only: writeHeavy = workspace default (no V-Order); readHeavyForPBI turns V-Order on"
        type: choice
        options: ["writeHeavy", "readHeavyForPBI", "readHeavyForSpark"]
        default: "writeHeavy"
      reset_outputs:
        description: "DESTRUCTIVE: delete the 4 output items and rebuild from scratch (landing data untouched)"
        type: boolean
        default: false

concurrency:
  group: onelake-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  # No longer `write`: a failed job used to cancel the whole run, which cost more than it
  # saved. Cancelling a GitHub job does not stop the Fabric-side notebook or Livy session it
  # already started, so the compute got spent anyway — what the cancel actually bought was a
  # run where every leg reads `cancelled`, including the one that failed, and no artifacts or
  # logs from the legs that were still mid-flight. Let each leg finish and report itself.
  actions: read

env:
  WS_ID: ${{ inputs.workspace || 'ea575278-bd81-459c-9680-47829898c902' }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  DBT_SCHEMA: mart
  AZURE_TRANSPORT_OPTION_TYPE: curl
  CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
  DUCKDB_TEMP_DIR: /tmp/duckdb_spill
  CI_DOWNLOAD_LIMIT: ${{ inputs.download_limit || '200' }}
  FABRIC_CORES: ${{ inputs.cores || '8' }}
  # Spark leg only, off by default: profiles.yml puts spark.native.enabled into the Livy conf.
  # That single key is Microsoft's current documented session-level recipe. NEE has documented
  # semantic divergences (round(), DECIMAL→FLOAT), so expect small value differences against the
  # other three engines while it is on.
  SPARK_NATIVE_ENABLED: ${{ inputs.native_execution_engine && 'true' || 'false' }}
  # Spark leg only. writeHeavy is the workspace default, so the default dispatch writes what a
  # plain Fabric session writes — and therefore NO V-Order, which readHeavyForPBI alone enables.
  # It was pinned to readHeavyForPBI in profiles.yml; making it an input means a layout change is
  # something a dispatch asks for. Expect the next build's layout table to move.
  SPARK_RESOURCE_PROFILE: ${{ inputs.spark_resource_profile || 'writeHeavy' }}
  # `reset_outputs` needs no env var — the `reset` job below reads the input directly. What it
  # does: DELETE the four output items (dbt_delta / dbt_iceberg / dbt_spark / dbt_dwh) before
  # anything else runs, so every model is rebuilt from scratch. Reach for it when tables are
  # wrong in a way no incremental write can repair, instead of --full-refresh (which DROPs on
  # dwh and fails outright on iceberg; see CLAUDE.md). It also replaced the `rebuild_summary`
  # input: one path to a clean table on all four engines, instead of three engine-specific ones
  # of which the iceberg one never worked.
  #
  # `dbt_landing` is NEVER dropped — provision.py excludes it by name — because it holds the
  # downloaded AEMO archive, the only data here that cannot be rebuilt from the workspace itself.
  #
  # Two consequences, neither of which surfaces as an error: a recreated item has a NEW GUID, so
  # anything bound to the old one (a Direct Lake semantic model, a shortcut) points at an item
  # that is gone; and the recreated warehouse comes back with a fresh connectionString and no
  # grants. `benchmark/` is fine — it deletes and recreates its models per dispatch.

jobs:
  # `reset` and `land` run SIDE BY SIDE — two boxes on one row of the graph, not a chain. They touch
  # different items (reset deletes the four OUTPUTS, land writes `dbt_landing`), so there is nothing
  # to order between them, and the legs wait for both.
  #
  # What this costs, and it is worth knowing before shortening it further: Fabric keeps a deleted
  # item's DISPLAY NAME reserved for minutes after the item stops being listed, so a drop followed
  # too closely by a create draws `409 ItemDisplayNameNotAvailableYet` — which is how the per-leg
  # version of this failed on run 30639018466, taking three legs with it. Chained, the whole
  # download sat between the drop and the leg that recreates the item. In parallel that gap is only
  # whatever `land` still has left to do when `reset` finishes, which can be nothing. The backstop
  # is real and was built for exactly this: `ensure()` polls through the 409 for ~10 minutes. So a
  # reset dispatch may now spend a minute or two waiting inside the leg instead of not waiting at
  # all — that is the trade, and it is only paid when `reset_outputs` is ticked.
  #
  # The job always runs; only its step is conditional. A job skipped by `if:` skips everything
  # that needs it, so gating the job itself would skip the entire build.
  reset:
    name: reset outputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        if: inputs.reset_outputs
      - uses: actions/setup-python@v5
        if: inputs.reset_outputs
        with: {python-version: "3.11"}
      - run: pip install duckrun
        if: inputs.reset_outputs
      - name: Drop the four output items
        if: inputs.reset_outputs
        run: python .github/scripts/provision.py reset

  land:
    name: land data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No `outputs:` any more. This job used to export FILES_PATH for every leg to share; each leg
    # now gets its own from `provision.py <engine>`, pointing at the `Files/landing` shortcut in
    # its own lakehouse. The FILES_PATH this job sets is the DIRECT dbt_landing path and is for
    # download_aemo.py, which writes the archive — that write CU belongs to `dbt_landing`.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install duckrun
      - name: Provision landing lakehouse
        run: python .github/scripts/provision.py land >> "$GITHUB_ENV"
      - name: Download AEMO data (obstore -> OneLake)
        run: python download_aemo.py

  # DuckDB-family: both engines are just DuckDB in a Python process, and that process always runs
  # in a Fabric notebook (duckrun.run_python), data-local to OneLake. The runner only ships
  # fabric_build.py there and relays its exit code.
  #
  # There used to be a second path — build on the runner when the fold looked small enough — sized
  # by a pending-file count. It is gone. Placement was a guess that had to be right every run: it
  # read the backlog through the very tables the build was about to write, so any table it could
  # not read collapsed the estimate, and the cheap case it optimised for (a handful of intraday
  # files) saved a session start-up while the expensive case it mis-sized cost a 7GB runner
  # thrashing on a real fold. One path, always remote, is the same build with nothing to get wrong.
  fabric:
    # Labelled by what the leg actually is — both are DuckDB, differing only in the table format
    # they write (delta-rs via duckrun, Iceberg via dbt-duckdb). "fabric duckrun" read as if the
    # engine were the adapter, and as if the other leg were not equally on Fabric. `label` is the
    # display name ONLY; `engine` is still the key provision.py and the dbt target key take.
    name: duckdb ${{ matrix.label }}
    # BOTH, not just `land`: with reset and land running side by side, needing `land` alone would
    # let a leg recreate its lakehouse while `reset` is still deleting it.
    needs: [reset, land]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # One engine failing says nothing about the other — they share only the landed data.
      fail-fast: false
      matrix:
        include:
          - {engine: duckrun, label: delta_rs}
          - {engine: iceberg, label: iceberg}
    # No job-level FILES_PATH. `provision.py <engine>` prints one pointing at the `Files/landing`
    # shortcut in THIS engine's own lakehouse, which is what splits the landing read CU per engine
    # — and a job-level `env` outranks anything a later step writes to $GITHUB_ENV, so a leftover
    # `FILES_PATH: ${{ needs.land.outputs.files_path }}` here would silently keep both legs on the
    # shared direct path and the split would look like it simply did not work. `needs: land` still
    # stands: the download has to have happened before anything reads it.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      # The runner never builds, so it needs only what fabric_run.py imports. pytz goes into the
      # notebook's own pip list, not here.
      - run: pip install duckrun
      - run: python .github/scripts/provision.py ${{ matrix.engine }} >> "$GITHUB_ENV"
      - name: dbt build in Fabric
        run: python .github/scripts/fabric_run.py ${{ matrix.engine }}

  # dwh + spark: dbt client on the runner, compute on Fabric's own servers.
  server:
    name: fabric-server ${{ matrix.engine }}
    needs: [reset, land]   # both — see the `fabric` job above
    runs-on: ubuntu-latest
    # Backlog-draining spark runs (1024-file folds) reach ~40 min; leave room for one retry.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: dwh, install: "dbt-fabric-samdebruyn dbt-core==1.11.10 dbt-adapters==1.23.0"}
          - {engine: spark, install: "dbt-fabricspark"}
    # No job-level FILES_PATH — same reason as the `fabric` job above: it would outrank the one
    # `provision.py <engine>` writes to $GITHUB_ENV and both legs would stay on the shared path.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ${{ matrix.install }} requests pytz
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: python .github/scripts/provision.py ${{ matrix.engine }} >> "$GITHUB_ENV"
      - name: Mint OneLake tokens
        run: |
          ST=$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$ST"; echo "ONELAKE_TOKEN=$ST" >> "$GITHUB_ENV"
          if [ "${{ matrix.engine }}" = "dwh" ]; then
            SQL=$(az account get-access-token --resource https://database.windows.net --query accessToken -o tsv)
            echo "::add-mask::$SQL"; echo "FABRIC_ACCESS_TOKEN=$SQL" >> "$GITHUB_ENV"
          fi
      - name: dbt build --target ${{ matrix.engine }}
        # `|| dbt retry`: a killed Livy session (or any transient failure) fails only the
        # nodes it touched; retry re-runs just those in a FRESH session/process instead of
        # failing the whole leg. retry replays the original flags from target/run_results.
        # retry needs --target too: without it dbt renders the profile's DEFAULT target
        # (duckrun), which demands ONELAKE_TABLES_PATH this job doesn't have.
        #
        # No `--exclude tag:heavy` any more: nothing carries the tag. It was on the assertions
        # that scanned fct_summary whole, and those were deleted when the suite was cut back to
        # one grain check. A selector matching zero nodes is a warning and a lie about what runs.
        run: dbt build --target ${{ matrix.engine }} --profiles-dir . || dbt retry --target ${{ matrix.engine }} --profiles-dir .
      # The conditional `Rebuild fct_summary` step (spark, --full-refresh) went with the
      # rebuild_summary input. By hand: dbt build --select fct_summary --full-refresh.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target-${{ matrix.engine }}
          path: target/

  # The cross-engine check, back as the last step of the build. `stats.py` reads all eight shared
  # tables from each item's Delta log and puts the four side by side — no test compares one engine
  # to another, so this is the only thing in the repo that can see drift.
  #
  # NO `if:` ON PURPOSE. The default is success(), so this runs only when every leg of `fabric`
  # AND `server` is green — all four engines. That is the whole point of it being here rather than
  # dispatched: a partial run publishes a table with holes in it, and holes read as drift that
  # isn't there. `fail-fast: false` on both matrices means a failing leg still lets the others
  # finish; it just means no dashboard for that run.
  #
  # It costs ~10 minutes per build and reports numbers that only move when tables are REWRITTEN —
  # that cost is why it was once split out into a `Table layout` workflow. That workflow is gone:
  # the layout is worth a green build's ten minutes, and a second copy was a second thing to keep
  # in step. Reading the layout now means running a build.
  # It only READS — nothing is written or provisioned.
  layout:
    name: table layout
    needs: [fabric, server]
    runs-on: ubuntu-latest
    # get_stats() over OneLake is slow on the iceberg item (12m+ observed for that one engine);
    # 15 minutes was cancelling stats.py mid-table and turning slowness into a red run.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install duckrun requests
      # `tee`, and STATS_JSON, so the result is not trapped on the run page: the markdown lands in
      # the step summary AND the job log, and the same numbers land in stats.json for `cu/`.
      # pipefail so a failed read cannot come out green through tee.
      - name: Parity + layout dashboard
        env:
          STATS_JSON: ${{ github.workspace }}/stats.json
        run: |
          set -o pipefail
          python .github/scripts/stats.py | tee -a "$GITHUB_STEP_SUMMARY"
      # `cu/` downloads this to print the layout beside the CU — off the latest successful run of
      # this workflow, which is the only place it comes from now.
      - name: Upload stats.json
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: stats
          path: stats.json
          if-no-files-found: warn
