name: Direct Lake benchmark

# MANUAL ONLY, non-gating. Ported from djouallah/duckrun's `parquet_layout.yml` (job "Benchmark
# (AEMO)"), and reframed by what this repo already has.
#
# Upstream had to MANUFACTURE the layouts it compared — it built a duckrun `SORTED BY AUTO` copy and
# a Fabric Spark V-Order copy of one fct_summary, then benchmarked two semantic models over them.
# Here the layouts already exist: four engines each write their own mart.fct_summary at row-count
# parity, in genuinely different physical shapes. So there is no build phase and no stats phase —
# this DEPLOYS one semantic model per engine, RUNS the DAX, and REPORTS the timings. Nothing else.
#
# Physical layout (files, row groups, size, v-order, compression) is already reported per engine by
# .github/scripts/stats.py in ci.yml's `summary` job, and is deliberately not re-derived here.
#
# Nothing is read from OneLake and nothing is written anywhere: the only endpoints this job touches
# are the Fabric control plane (deploy) and XMLA (query). ci.yml's parity dashboard is unaffected.
#
# ci.yml is the pipeline that produces the data; this grades how fast it is to QUERY. See
# benchmark/README.md.
on:
  workflow_dispatch:
    inputs:
      workspace:
        description: "Fabric workspace GUID"
        type: string
        default: "ea575278-bd81-459c-9680-47829898c902"
      engines:
        description: "engines to benchmark, comma-separated. The FIRST is the reference every ratio is taken against."
        type: string
        default: "duckrun,iceberg,spark,dwh"
      runs:
        description: "HOT runs per query per model (run 1/2 dropped as warm; rest median'd)"
        type: string
        default: "3"
      cold:
        description: "measure cold by dehydrating (clearValues+full) before each query"
        type: boolean
        default: true
      cold_repeats:
        description: "cold dehydrate->query cycles per cold-tier query (median + spread reported)"
        type: string
        default: "1"
      gap_seconds:
        description: "idle seconds between models (>5min CU smoothing => clean gaps in the capacity chart)"
        type: string
        default: "600"

# SHARED with ci.yml on purpose, and load-bearing. Not for correctness — this run only reads — but
# because a concurrent dbt build contends for the same Fabric capacity, and capacity contention is
# the one thing a wall-clock benchmark cannot absorb. Not cancel-in-progress, matching ci.yml: a
# dispatch queues behind a push run instead of racing it.
concurrency:
  group: onelake-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # The free gate: no Fabric, no capacity, no network at run time. It buys two things a paid job
  # cannot — a broken verdict layer never reaches a report that might name the slower engine the
  # winner, and a malformed .bim never reaches a deploy that fails after ADOMD.NET is installed.
  # duckrun is installed because test_templates.py asserts the templates against duckrun's OWN
  # repoint regexes; a local copy of them could drift from the thing that actually parses the file.
  # This is the only check in the repo that touches no Fabric at all.
  checks:
    name: verdict + template checks (free)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest "duckrun>=0.4.35"
      - name: pytest benchmark/
        run: python -m pytest benchmark/ -q

  bench:
    name: benchmark
    needs: checks
    runs-on: ubuntu-latest
    # Upstream's XMLA step took 21 min for TWO models over 15 cold-measured queries with one 300s
    # gap. This runs four models over 21, and one of them (`raw_scada_mw`) transcodes a column of the
    # largest table in the project — so budget several times that, plus three 600s gaps.
    # It is billed Fabric capacity: cancel a superseded run immediately (CLAUDE.md, CI etiquette),
    # and use the scouting inputs in benchmark/README.md before committing to a full pass.
    timeout-minutes: 330
    env:
      # The ONLY Azure inputs, same two secrets as ci.yml: the OIDC federated identity. duckrun mints
      # every token it needs (storage, Fabric control plane, Power BI) and resolves the workspace and
      # items itself — so there is no azure/login and no `az` anywhere in this job.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      WS_ID: ${{ inputs.workspace }}
      BENCH_ENGINES: ${{ inputs.engines }}
      BENCH_RUNS: ${{ inputs.runs }}
      BENCH_COLD: ${{ inputs.cold }}
      COLD_REPEATS: ${{ inputs.cold_repeats }}
      BENCH_GAP_SECONDS: ${{ inputs.gap_seconds }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # >=0.4.35 is the floor this repo already requires (CLAUDE.md). The benchmark additionally
      # needs Workspace.deploy()'s Direct Lake + DirectQuery repoints and auth.get_powerbi_token().
      - name: Install deps
        run: pip install "duckrun>=0.4.35" pythonnet requests

      - name: Init run report
        run: |
          echo "RUN_REPORT=$PWD/run_report.json" >> "$GITHUB_ENV"
          RUN_REPORT="$PWD/run_report.json" python benchmark/report.py init

      - name: Install ADOMD.NET client (.NET Core build, cross-platform)
        run: |
          set -euo pipefail
          # ADOMD.NET's NetCore build is cross-platform and loads under pythonnet/coreclr. `dotnet
          # publish` a throwaway console app that references it so the DLL AND all its dependency
          # assemblies (Microsoft.Identity.Client, IdentityModel.*, …) land in one folder that
          # xmla_compare._load_adomd can glob. (A bare nupkg would miss the transitive deps.)
          proj="$RUNNER_TEMP/adomd"
          mkdir -p "$proj" && cd "$proj"
          dotnet new console -o . --force >/dev/null
          dotnet add package Microsoft.AnalysisServices.AdomdClient.NetCore.retail.amd64 >/dev/null
          dotnet publish -c Release -o publish >/dev/null
          test -f "$proj/publish/Microsoft.AnalysisServices.AdomdClient.dll"
          echo "ADOMD_DIR=$proj/publish" >> "$GITHUB_ENV"
          echo "resolved ADOMD_DIR=$proj/publish"

      # Emits PBI_WORKSPACE (the workspace DISPLAY name — XMLA addresses by name) and BENCH_ITEMS
      # (engine -> item/kind/guid/mode/writer) for every later step.
      - name: Resolve workspace + per-engine items
        run: python benchmark/resolve_env.py

      # One semantic model per engine over that engine's own mart.fct_summary. Direct Lake for the
      # lakehouses (deploy refreshes them, so this returns only once live); DirectQuery for the
      # warehouse (no refresh — it queries live). Rewrites BENCH_ENGINES to the engines that actually
      # deployed, so a failed deploy can't make xmla_compare wait out 16 warm-up retries.
      - name: Deploy semantic models
        run: python benchmark/deploy_models.py

      # No token re-mint before XMLA: xmla_compare.py self-acquires the Power BI token via duckrun,
      # which re-exchanges a fresh OIDC assertion (so a long deploy can't hand back an expiring one).
      - name: Benchmark every model over XMLA
        env:
          PYTHONNET_RUNTIME: coreclr
          PYTHONUNBUFFERED: "1"   # non-TTY runner block-buffers stdout; stream the per-query trace live
        run: python benchmark/xmla_compare.py

      - name: Render report to job summary
        if: always()
        continue-on-error: true
        run: python benchmark/render_report.py

      # The one step here that can fail the job: it exits 1 on a verdict-direction inversion.
      - name: Render specialist findings to job summary
        if: always()
        run: python benchmark/render_summary.py

      - name: Upload run report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: run-report
          path: run_report.json
          if-no-files-found: warn
