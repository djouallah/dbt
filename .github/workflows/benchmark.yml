name: Direct Lake benchmark

# MANUAL ONLY, non-gating. Ported from djouallah/duckrun's `parquet_layout.yml` (job "Benchmark
# (AEMO)"), and reframed by what this repo already has.
#
# Upstream had to MANUFACTURE the layouts it compared — it built a duckrun `SORTED BY AUTO` copy and
# a Fabric Spark V-Order copy of one fct_summary, then benchmarked two semantic models over them.
# Here the layouts already exist: four engines each write their own mart.fct_summary at row-count
# parity, in genuinely different physical shapes. So there is no build phase and no stats phase —
# this DEPLOYS one semantic model per engine, RUNS the DAX, and REPORTS the timings. Nothing else.
#
# What it measures is ONE USER SESSION per engine. The deploy DELETES and recreates the model, so it
# starts with an empty VertiPaq store; the suite is then walked `runs` times and the pass number is
# the tier — 1 cold, 2 warm, 3+ hot. Nothing is cleared between passes: the per-query
# `clearValues` dehydrate is gone, because no user is ever in that state.
#
# ONE JOB PER ENGINE, and that is the point of the shape. Every Fabric/XMLA token is valid for about
# an hour; a single job walking four models over 25 queries with two 600s idle gaps runs well past
# that, and the expiry lands mid-measurement on whichever engine happens to be last. A separate job
# per engine mints its own token, minutes before it uses it, and retires it with the job — so no run
# can die halfway through for a reason that has nothing to do with the thing being measured. The
# matrix is `max-parallel: 1`: the engines still run one at a time, because a wall-clock benchmark
# cannot absorb two models contending for the same capacity.
#
# The cost of the split is that no process holds all four engines' timings any more, so the ratios
# moved to the render layer: each job uploads a report FRAGMENT, and `report` merges them and renders.
#
# Physical layout (files, row groups, size, v-order, compression) is already reported per engine by
# .github/scripts/stats.py in the `layout` job of the `dbt` workflow, and is deliberately not re-derived here.
#
# Nothing is read from OneLake and nothing is written anywhere: the only endpoints this job touches
# are the Fabric control plane (deploy) and XMLA (query). dbt.yml's parity dashboard is unaffected.
#
# dbt.yml is the pipeline that produces the data; this grades how fast it is to QUERY. See
# benchmark/README.md.
on:
  # Callable from `all.yml`. **This does NOT weaken the no-auto-trigger rule** — read it carefully
  # before adding anything else here. The rule exists because the query passes are interactive CU on
  # shared capacity, which is the usage a capacity admin notices and asks about, so a run nobody
  # chose to start is the one that causes trouble. `all.yml` is `workflow_dispatch` only, so a human
  # still chose every run that reaches this. What remains forbidden, here and there, without
  # exception: `schedule`, `push`, `workflow_run`, `repository_dispatch`.
  workflow_call:
    inputs:
      workspace: { type: string, required: false, default: "" }
      # `dwh`, not all four — see the dispatch input below. `all.yml` passes its own value down.
      engines: { type: string, required: false, default: "dwh" }
      runs: { type: string, required: false, default: "6" }
      think_seconds: { type: string, required: false, default: "4" }
      gap_seconds: { type: string, required: false, default: "600" }
      top_duid: { type: string, required: false, default: "" }
  workflow_dispatch:
    inputs:
      workspace:
        description: "Fabric workspace GUID. Blank = the FABRIC_WORKSPACE_ID repo secret, which is where it normally comes from."
        type: string
        default: ""
      engines:
        description: "engines to benchmark, comma-separated. Order is the order they are MEASURED in — no reference engine, no number in the report depends on it. Defaults to dwh alone; type the full list to compare engines."
        type: string
        # `dwh`, not all four, matching dbt.yml and all.yml. This is the most expensive default in
        # the repo to get wrong: the query passes are INTERACTIVE CU on shared capacity — the class
        # of usage a capacity admin notices — and the paid work is `max-parallel: 1`, so four
        # engines is four sequential jobs of 25 queries x `runs` passes with two 600s gaps each.
        # A single engine still exercises deploy -> XMLA -> render end to end, which is what a
        # standalone dispatch is usually for; comparing layouts is what the full list is for.
        # NOTE this is the one workflow where a single engine changes what the REPORT means, not
        # just its width: with one column there is no ranking and no `x fastest`, so it reads as a
        # timing record for that engine rather than a comparison.
        default: "dwh"
      runs:
        description: "PASSES over the whole query suite. The pass number is the tier: 1 cold (a freshly created model), 2 warm, 3+ hot (median). Below 3 there is no hot tier."
        type: string
        default: "6"
      think_seconds:
        description: "idle seconds BETWEEN queries — a user reading a visual before clicking the next. Outside every timed region, so it changes what is reproduced, not what is measured. Idle inside the token's ~1h life though, so raising it eats the headroom the per-engine split protects. 0 disables."
        type: string
        default: "4"
      gap_seconds:
        description: "idle seconds before each engine after the first (>5min CU smoothing => clean gaps in the capacity chart). NOT think time — this is between ENGINES, and it runs before the token is minted."
        type: string
        default: "600"
      top_duid:
        description: "optional: pin the DUID the selectivity ladder filters on. Pinned, the ladder runs from pass 1; unpinned it is resolved AFTER the cold pass (resolving it transcodes DUID and mw) and joins at pass 2."
        type: string
        default: ""

# SHARED with dbt.yml on purpose, and load-bearing. Not for correctness — this run only reads — but
# because a concurrent dbt build contends for the same Fabric capacity, and capacity contention is
# the one thing a wall-clock benchmark cannot absorb. Not cancel-in-progress, matching dbt.yml: a
# dispatch queues behind a push run instead of racing it.
concurrency:
  group: onelake-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  # Every job reads these; the per-engine jobs additionally narrow BENCH_ENGINES to themselves.
  BENCH_ENGINES: ${{ inputs.engines }}
  BENCH_RUNS: ${{ inputs.runs }}
  BENCH_THINK_SECONDS: ${{ inputs.think_seconds }}
  BENCH_GAP_SECONDS: ${{ inputs.gap_seconds }}
  BENCH_TOP_DUID: ${{ inputs.top_duid }}
  PYTHONIOENCODING: utf-8

jobs:
  # The free gate: no Fabric, no capacity, no network at run time. It buys two things a paid job
  # cannot — a broken ranking layer never reaches a report that might name the slower engine the
  # winner, and a malformed .bim never reaches a deploy that fails after ADOMD.NET is installed.
  # duckrun is installed because test_templates.py asserts the templates against duckrun's OWN
  # repoint regexes; a local copy of them could drift from the thing that actually parses the file.
  # This is the only check in the repo that touches no Fabric at all.
  checks:
    name: ranking + template checks (free)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest "duckrun>=0.4.36"
      - name: pytest benchmark/
        run: python -m pytest benchmark/ -q

  # Resolve the workspace and EVERY engine's item once, and emit the matrix the bench jobs fan out
  # over. Two reasons this is its own job rather than a step in each: a renamed item fails here,
  # before any capacity is spent, instead of on the third job of a serialized matrix; and the `run`
  # block (inputs, sha, workspace) is written once, by one job, so no per-engine fragment can
  # overwrite it with its own single-engine view.
  resolve:
    name: resolve workspace + engine matrix
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      # Blank input -> the FABRIC_WORKSPACE_ID SECRET, so the GUID is not written into this
      # repo. It cannot be defaulted on the input itself (a `default:` takes no context) nor
      # passed down from all.yml (`jobs.<id>.with` is the one place `secrets` is NOT
      # available), so every called workflow resolves it here, for itself.
      WS_ID: ${{ inputs.workspace || secrets.FABRIC_WORKSPACE_ID }}
      RUN_REPORT: ${{ github.workspace }}/fragments/report-00-meta.json
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      pbi_workspace: ${{ steps.resolve.outputs.pbi_workspace }}
      bench_items: ${{ steps.resolve.outputs.bench_items }}
      # NO ws_id output. The workspace GUID is a SECRET now, and GitHub evaluates job outputs on the
      # runner and DROPS any whose value matches a secret — logging `Skip output ws_id since it may
      # contain secret` and handing the next job an empty string. The bench jobs would have run with
      # a blank WS_ID. They resolve the secret themselves instead, exactly as this job does; it was
      # never a derived value, only an echo. pbi_workspace (a display NAME) and bench_items (item
      # GUIDs, not secrets) pass through fine.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install "duckrun>=0.4.36" requests
      - name: Init run report
        run: |
          mkdir -p fragments
          python benchmark/report.py init
      # `report-00-meta.json` sorts first, which is how merge_reports.py guarantees the run block is
      # laid down before any engine fragment merges on top of it.
      - name: Resolve workspace + per-engine items
        id: resolve
        run: python benchmark/resolve_env.py
      - uses: actions/upload-artifact@v4
        with:
          name: report-fragment-meta
          path: fragments/report-00-meta.json

  bench:
    # The engine name is in the job name, so the run's job list reads as the experiment: four
    # adapters, one per row.
    name: benchmark ${{ matrix.engine }}
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      # Serialized on purpose. Not for correctness — nothing here writes — but because two models
      # queried at once contend for the same capacity, and a wall-clock number cannot absorb that.
      max-parallel: 1
      # Never fail-fast: one engine failing to deploy or warm up must not cost the others their
      # measurement. The report names whichever engines are missing.
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    # One engine over 25 queries x `runs` passes, plus one idle gap and the deploy. `raw_scada_mw`
    # transcodes a column of the largest table in the project, so this is not a small budget.
    # It is billed Fabric capacity: cancel a superseded run immediately (CLAUDE.md, CI etiquette),
    # and use the scouting inputs in benchmark/README.md before committing to a full pass.
    timeout-minutes: 120
    env:
      # The ONLY Azure inputs, same two secrets as dbt.yml: the OIDC federated identity. duckrun mints
      # every token it needs (storage, Fabric control plane, Power BI) and resolves the workspace and
      # items itself — so there is no azure/login and no `az` anywhere in this job. Each engine's job
      # exchanges its OWN fresh OIDC assertion, which is the whole reason the matrix exists.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      WS_ID: ${{ inputs.workspace || secrets.FABRIC_WORKSPACE_ID }}
      PBI_WORKSPACE: ${{ needs.resolve.outputs.pbi_workspace }}
      BENCH_ITEMS: ${{ needs.resolve.outputs.bench_items }}
      # Narrowed to this engine: deploy_models.py deploys only it, and xmla_compare.py takes its
      # per-engine path — measure one model, write its timings, compute no ratios.
      BENCH_ENGINES: ${{ matrix.engine }}
      RUN_REPORT: ${{ github.workspace }}/fragments/report-${{ matrix.engine }}.json
    steps:
      - name: ${{ matrix.engine }} — checkout
        uses: actions/checkout@v4

      - name: ${{ matrix.engine }} — set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # >=0.4.36 for Workspace.deploy(mode=), which is what lets the WAREHOUSE be read by Direct
      # Lake like the three lakehouses instead of DirectQuery — so all four legs measure a Delta
      # layout rather than three layouts and one pushdown. (The repo's dbt floor is 0.4.35; this
      # job needs the higher one, plus the OneLake repoints and auth.get_powerbi_token().)
      - name: ${{ matrix.engine }} — install deps
        run: pip install "duckrun>=0.4.36" pythonnet requests

      # Before the first token is minted, not after: the gap is idle time by design, and burning it
      # on the far side of the deploy would spend a third of the token's life waiting.
      - name: ${{ matrix.engine }} — idle gap for the capacity chart
        if: matrix.index != 0 && inputs.gap_seconds != '0'
        run: |
          echo "sleeping ${BENCH_GAP_SECONDS}s before ${{ matrix.engine }} so the Fabric capacity"
          echo "chart shows a clean separation between models (>5min CU smoothing window)."
          sleep "$BENCH_GAP_SECONDS"

      - name: ${{ matrix.engine }} — install ADOMD.NET client (.NET Core build, cross-platform)
        run: |
          set -euo pipefail
          # ADOMD.NET's NetCore build is cross-platform and loads under pythonnet/coreclr. `dotnet
          # publish` a throwaway console app that references it so the DLL AND all its dependency
          # assemblies (Microsoft.Identity.Client, IdentityModel.*, …) land in one folder that
          # xmla_compare._load_adomd can glob. (A bare nupkg would miss the transitive deps.)
          proj="$RUNNER_TEMP/adomd"
          mkdir -p "$proj" && cd "$proj"
          dotnet new console -o . --force >/dev/null
          dotnet add package Microsoft.AnalysisServices.AdomdClient.NetCore.retail.amd64 >/dev/null
          dotnet publish -c Release -o publish >/dev/null
          test -f "$proj/publish/Microsoft.AnalysisServices.AdomdClient.dll"
          echo "ADOMD_DIR=$proj/publish" >> "$GITHUB_ENV"
          echo "resolved ADOMD_DIR=$proj/publish"

      # ONE semantic model, this engine's, over its own mart.fct_summary, from the ONE template:
      # lakehouse=/warehouse= says which item holds the tables, mode= says how it is read. Direct
      # Lake, so the deploy reframes and returns only once the model is live. The Fabric token this
      # mints is minutes old when the XMLA step below starts using it.
      - name: ${{ matrix.engine }} — deploy semantic model
        run: |
          mkdir -p fragments
          python benchmark/deploy_models.py

      # No token re-mint needed: xmla_compare.py self-acquires the Power BI token via duckrun, which
      # re-exchanges a fresh OIDC assertion. With one engine per job the whole measurement now fits
      # comfortably inside one token's life — which is what this refactor bought.
      - name: ${{ matrix.engine }} — benchmark over XMLA
        env:
          PYTHONNET_RUNTIME: coreclr
          PYTHONUNBUFFERED: "1"   # non-TTY runner block-buffers stdout; stream the per-query trace live
        run: python benchmark/xmla_compare.py

      # The fragment, not a report: ratios need every engine and are computed in `report` below.
      - name: ${{ matrix.engine }} — upload report fragment
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: report-fragment-${{ matrix.engine }}
          path: fragments/report-${{ matrix.engine }}.json
          if-no-files-found: warn

  # Where every comparison is now made. Free: no Fabric, no XMLA, no capacity — it reads the merged
  # fragments and nothing else. `if: always()` because a report covering three of four engines is
  # exactly what you want when the fourth failed, and it names the missing one.
  report:
    name: merge fragments + render report
    needs: [resolve, bench]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_REPORT: ${{ github.workspace }}/run_report.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download every report fragment
        uses: actions/download-artifact@v4
        with:
          pattern: report-fragment-*
          path: fragments

      - name: Merge fragments into one run report
        run: python benchmark/merge_reports.py fragments

      - name: Render report to job summary
        continue-on-error: true
        run: python benchmark/render_report.py

      # The one step here that can fail the job: it exits 1 on a verdict-direction inversion.
      - name: Render specialist findings to job summary
        run: python benchmark/render_summary.py

      - name: Upload run report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: run-report
          path: run_report.json
          if-no-files-found: warn
