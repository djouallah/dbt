name: dbt

# land once -> run the same models on 4 engines in Fabric -> test every output with one
# neutral reader -> report. Compute is always Fabric; the runner only downloads and drives.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      workspace:
        description: "Fabric workspace GUID"
        type: string
        default: "ea575278-bd81-459c-9680-47829898c902"
      download_limit:
        description: "files to download per source"
        type: string
        default: "200"
      cores:
        description: "Fabric Python-notebook vCores"
        type: choice
        options: ["4", "8", "16", "32", "64"]
        default: "8"

concurrency:
  group: onelake-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  # Fail-fast rule: any failed job cancels the WHOLE run (see the cancel steps) — a doomed
  # run must not keep burning Fabric compute on the other legs.
  actions: write

env:
  WS_ID: ${{ inputs.workspace || 'ea575278-bd81-459c-9680-47829898c902' }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  DBT_SCHEMA: mart
  AZURE_TRANSPORT_OPTION_TYPE: curl
  CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
  DUCKDB_TEMP_DIR: /tmp/duckdb_spill
  CI_DOWNLOAD_LIMIT: ${{ inputs.download_limit || '200' }}
  FABRIC_CORES: ${{ inputs.cores || '8' }}

jobs:
  land:
    name: land data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      files_path: ${{ steps.prov.outputs.files_path }}
      # New PUBLIC_DAILY files landed this run — the fabric job's runner-vs-Fabric signal.
      new_daily: ${{ steps.dl.outputs.new_daily }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install duckrun
      - name: Provision landing lakehouse
        id: prov
        run: |
          python .github/scripts/provision.py land | tee /tmp/land.env >> "$GITHUB_ENV"
          echo "files_path=$(grep '^FILES_PATH=' /tmp/land.env | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
      - name: Download AEMO data (obstore -> OneLake)
        id: dl
        run: python download_aemo.py
      - name: Cancel whole run on failure
        if: failure()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh run cancel ${{ github.run_id }} -R ${{ github.repository }}

  # DuckDB-family: both engines are just DuckDB in a Python process, so CI is free to place that
  # process. It builds HERE when `land` downloaded no new PUBLIC_DAILY file (an intraday-only fold
  # the runner reads in a minute — a Fabric session start-up would cost more than the build), and
  # ships into a Fabric notebook (duckrun.run_python) otherwise, so a real fold stays data-local to
  # OneLake. Same driver (fabric_build.py) either way; only the interpreter it runs in changes.
  fabric:
    name: fabric ${{ matrix.engine }}
    needs: land
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        engine: [duckrun, iceberg]
    env:
      FILES_PATH: ${{ needs.land.outputs.files_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      # pytz: a runner-side `dbt run` needs it too, not just the notebook (fabric_run.py pip list).
      - run: pip install duckrun pytz
      - run: python .github/scripts/provision.py ${{ matrix.engine }} >> "$GITHUB_ENV"
      # Exactly one of these two runs. Anything other than a literal '0' — including an empty
      # output if the downloader died before reporting — takes the Fabric branch, the path that
      # works at any size.
      - name: dbt run on the runner (no new daily file landed)
        if: needs.land.outputs.new_daily == '0'
        run: python .github/scripts/fabric_build.py ${{ matrix.engine }}
      - name: dbt run in Fabric
        if: needs.land.outputs.new_daily != '0'
        run: python .github/scripts/fabric_run.py ${{ matrix.engine }}
      - name: Cancel whole run on failure
        if: failure()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh run cancel ${{ github.run_id }} -R ${{ github.repository }}

  # dwh + spark: dbt client on the runner, compute on Fabric's own servers.
  server:
    name: fabric-server ${{ matrix.engine }}
    needs: land
    runs-on: ubuntu-latest
    # Backlog-draining spark runs (1024-file folds) reach ~40 min; leave room for one retry.
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - {engine: dwh, install: "dbt-fabric-samdebruyn dbt-core==1.11.10 dbt-adapters==1.23.0"}
          - {engine: spark, install: "dbt-fabricspark"}
    env:
      FILES_PATH: ${{ needs.land.outputs.files_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ${{ matrix.install }} requests pytz
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: python .github/scripts/provision.py ${{ matrix.engine }} >> "$GITHUB_ENV"
      - name: Mint OneLake tokens
        run: |
          ST=$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$ST"; echo "ONELAKE_TOKEN=$ST" >> "$GITHUB_ENV"
          if [ "${{ matrix.engine }}" = "dwh" ]; then
            SQL=$(az account get-access-token --resource https://database.windows.net --query accessToken -o tsv)
            echo "::add-mask::$SQL"; echo "FABRIC_ACCESS_TOKEN=$SQL" >> "$GITHUB_ENV"
          fi
      - name: dbt run --target ${{ matrix.engine }}
        # `|| dbt retry`: a killed Livy session (or any transient failure) fails only the
        # models it touched; retry re-runs just those in a FRESH session/process instead of
        # failing the whole leg. retry replays the original flags from target/run_results.
        # retry needs --target too: without it dbt renders the profile's DEFAULT target
        # (duckrun), which demands ONELAKE_TABLES_PATH this job doesn't have.
        run: dbt run --target ${{ matrix.engine }} --profiles-dir . || dbt retry --target ${{ matrix.engine }} --profiles-dir .
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target-${{ matrix.engine }}
          path: target/
      - name: Cancel whole run on failure
        if: failure()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh run cancel ${{ github.run_id }} -R ${{ github.repository }}

  # One neutral duckrun reader (DuckDB + delta_scan) grades EVERY engine's output: the thesis is
  # "engine doesn't matter, output does". Read via Delta, not the iceberg reader — that one chokes
  # on XTable-generated metadata, but every item is also a Delta table on OneLake.
  test:
    name: test ${{ matrix.engine }}
    needs: [fabric, server]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - {engine: duckrun, item: dbt_delta, kind: lakehouses}
          - {engine: iceberg, item: dbt_iceberg, kind: lakehouses}
          - {engine: dwh, item: dbt_dwh, kind: warehouses}
          - {engine: spark, item: dbt_spark, kind: lakehouses}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install duckrun pytz
      - name: Resolve ${{ matrix.item }} -> ONELAKE_TABLES_PATH
        run: python .github/scripts/item_path.py ${{ matrix.item }} ${{ matrix.kind }} >> "$GITHUB_ENV"
      - name: dbt test — ${{ matrix.engine }} output
        run: |
          rc=0; dbt test --target duckrun --profiles-dir . \
            --exclude tag:heavy assert_fct_summary_no_partial_dates || rc=$?
          cp target/run_results.json "rr-${{ matrix.engine }}.json" 2>/dev/null || true
          exit $rc
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.engine }}
          path: rr-${{ matrix.engine }}.json
          if-no-files-found: warn
      - name: Cancel whole run on failure
        if: failure()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh run cancel ${{ github.run_id }} -R ${{ github.repository }}

  # The workflow's ONLY step summary. always(): the report matters most when a leg failed.
  summary:
    name: summary
    needs: test
    if: always()
    runs-on: ubuntu-latest
    # get_stats() over OneLake is slow on the iceberg item (12m+ observed for that one engine);
    # 15 minutes was cancelling stats.py mid-table and turning slowness into a red run.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install duckrun requests
      - uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: rr
          merge-multiple: true
      - run: python .github/scripts/summary.py rr >> "$GITHUB_STEP_SUMMARY"
      - run: python .github/scripts/stats.py >> "$GITHUB_STEP_SUMMARY"
