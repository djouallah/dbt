name: Dashboard

# THE PAGE, and one of only two workflows in this repo. It reads capacity units for the item GUIDs
# the `Benchmark` workflow recorded, tops up the ledger, and publishes
# https://djouallah.github.io/fabric-dbt-benchmark/.
#
#   measure (cu/measure.py -> history/cu.json)  ->  render (cu/dashboard.py -> the page)
#
# **Two JSON documents, joined on the item GUID.** `Benchmark` commits
# `history/runs/<ts>-<run id>.json` naming every Fabric item it created, with its role; `measure`
# builds `history/cu.json`, a cumulative `{item GUID: {operation: {hour: CU}}}` ledger. The page is
# the join. Nothing else passes between the two workflows — no artifact, no shared env, no `needs:`.
#
# **The measurement does not refresh the metrics model and resolves no names.** That refresh is what
# Power BI throttled per-identity — every attempt 429 on two consecutive runs, and 41,887 CU of
# notebook compute landing under `shared` because the items resolved to no name. The fact table
# carries the item GUID and the workspace id as columns of its own, so neither is needed.
#
# **Re-dispatching is the top-up.** An hour's CU keeps growing for ~70 minutes after the fact, so a
# run measured minutes ago is a LOWER BOUND — the page says so per column. `measure` re-reads only
# the time that can still move: an item is frozen once a read changed nothing about it and it has
# been quiet for three hours, and its window is never queried again. So dispatching this twice is
# how a number becomes final, and dispatching it ten times costs almost nothing.
#
# **`workflow_dispatch` only, and that is the standing rule.** No `schedule`, no `push`, no
# `workflow_run`, no `workflow_call` — deliberately NOT chained off `Benchmark`. Publishing is a
# decision: a page that republishes itself whenever a measurement lands will eventually publish one
# nobody looked at, and this page is the public face of the repo. Committing the ledger from CI is
# only safe because nothing here answers a push.
on:
  workflow_dispatch:
    inputs:
      # Off re-renders from the committed ledger: free, offline, and the way to fix the page
      # without spending a metrics query.
      measure:
        description: "measure CU before rendering"
        type: boolean
        default: true
      # A substring of the record's FILENAME, so a run id or a date both work.
      record:
        description: "render one run alone — run id or date; blank = latest per engine"
        type: string
        default: ""
      # In the MODEL'S clock (the app's own +10 offset, not UTC) — a wrong value reads as "no
      # activity" rather than as an error. Blank is computed from the earliest unsettled run,
      # which is what you want; set it to re-read a window by hand.
      since:
        description: "CU floor override, in the model's clock (+10)"
        type: string
        default: ""
      workspace:
        description: "workspace GUID; blank = the repo secret"
        type: string
        default: ""

# Its own group. It measures nothing timing-sensitive, so it has no reason to queue behind a build —
# and cancel-in-progress because a superseded publish has nothing worth finishing.
concurrency:
  group: dashboard-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The only job here that touches Fabric, spends anything, or can fail for a Fabric reason. It is
  # `continue-on-error` for exactly that reason: a throttled or unavailable metrics model must cost a
  # stale number, never a stale page.
  measure:
    name: read capacity units
    if: inputs.measure
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    permissions:
      id-token: write     # OIDC -> the Power BI token
      contents: write     # commits history/cu.json
    env:
      # Every one of these is a real GUID and therefore a SECRET: no tracked file holds one. An
      # input's `default:` cannot take a context, so the fallback lives here, where `secrets` IS
      # available. measure.py keeps no default either — a hardcoded fallback would put the value back
      # in the repo and outvote the secret whenever the env var arrived empty.
      CU_METRICS_WORKSPACE_ID: ${{ secrets.CU_METRICS_WORKSPACE_ID }}
      CU_METRICS_MODEL_ID: ${{ secrets.CU_METRICS_MODEL_ID }}
      CU_CAPACITY_ID: ${{ secrets.CU_CAPACITY_ID }}
      CU_WORKSPACE_FILTER: ${{ inputs.workspace || secrets.FABRIC_WORKSPACE_ID }}
      CU_SINCE: ${{ inputs.since }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      # `requests` is the entire runtime dependency of the measurement. No duckrun, no ADOMD, no
      # .NET — this talks to the Power BI executeQueries REST endpoint, which takes DAX as a JSON
      # string.
      - run: pip install requests pytest

      # Free, offline, ~1s, before the login. Everything it covers fails as a plausible number rather
      # than as an error: summing instead of overwriting multiplies an hour by how often it was read,
      # removing on absence erases everything past the app's 14-day retention, settling too early
      # freezes a partial total forever.
      - name: Test the ledger and the render layer offline
        run: python -m pytest cu/ -q

      # Same OIDC federated identity as the Benchmark workflow. allow-no-subscriptions because the
      # deploy app is a workspace principal, not an Azure RBAC one.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Minted here, not a repo secret. The community consensus is that a service principal cannot
      # read the Capacity Metrics model; it can, measured on run 30536137179. If it is ever refused,
      # the manual hatch is the same command against a user account, exported as PBI_TOKEN.
      - name: Acquire a Power BI token
        run: |
          set -euo pipefail
          TOKEN=$(az account get-access-token \
            --resource https://analysis.windows.net/powerbi/api \
            --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "PBI_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Top up the CU ledger
        run: python cu/measure.py

      # The ledger is the only storage that outlives the app's ~14-day retention, so committing it IS
      # the measurement's output. `pull --rebase` because a queued dispatch can have moved main since
      # checkout; the diff check exits 0 so a re-read that changed nothing does not fail the job —
      # which is the expected outcome once everything has settled.
      - name: Commit the ledger
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/cu.json
          git diff --cached --quiet && { echo "ledger unchanged — everything settled" >&2; exit 0; }
          git commit -m "cu: capacity units as of run ${{ github.run_id }}"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

  # Free, offline, and it CANNOT fail for a Fabric reason — no token, no Azure login, no `requests`.
  # That last one is enforced by not installing it: `measure.py` imports it optionally, so this job
  # proves by running that the render path never reaches the network. It is what makes republishing a
  # free, repeatable act rather than a measurement.
  #
  # `always()` so a throttled measurement still publishes the page from what is already committed.
  render:
    name: render the page
    needs: measure
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CU_RECORD: ${{ inputs.record }}
      PYTHONIOENCODING: utf-8
    steps:
      # `ref:` MATTERS. The default checkout takes `github.sha` — the commit that triggered the
      # dispatch — so it would read the ledger as it was BEFORE the measure job committed to it, and
      # every page would be one dispatch stale. Take the branch head instead.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pytest

      - name: Test the render layer offline
        run: python -m pytest cu/ -q

      # stdout is the markdown; diagnostics (which runs were composed, what was folded) go to stderr.
      - name: Render the dashboard
        run: |
          set -o pipefail
          python cu/dashboard.py | tee dashboard.md | tee -a "$GITHUB_STEP_SUMMARY"

      # Markdown -> one self-contained HTML file: inline CSS, no script, font or image, so the
      # artifact copy opens off a local disk with no network years later. The bar charts travel
      # through the markdown as HTML comments because GitHub sanitises inline SVG in a job summary —
      # invisible there, drawn here.
      - name: Render it as a page
        run: |
          set -euo pipefail
          mkdir -p site
          python cu/report_html.py dashboard.md \
            "Rendered by the \`Dashboard\` workflow, run ${{ github.run_id }} \
             (\`${{ github.sha }}\`), from the run records and the CU ledger under \`history/\`. \
             Each dispatch replaces this page; the per-run copy is that run's \`dashboard\` \
             artifact." > site/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: |
            dashboard.md
            site/index.html
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Separate job because `deploy-pages` needs the `github-pages` environment. `needs: render` means a
  # render that failed cannot overwrite a good page with a half-written one.
  publish:
    name: publish
    needs: render
    # A status function, for the same reason `layout` carries one in benchmark.yml: GitHub skips a
    # job when ANY ancestor was skipped, and it propagates straight through `render`'s `always()`.
    # So `measure=false` — the documented free, offline re-render — rendered a page and silently
    # published nothing, which looks exactly like a page that did not change.
    if: ${{ !cancelled() && needs.render.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
