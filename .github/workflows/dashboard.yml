name: Dashboard

# THE PAGE — https://djouallah.github.io/fabric-dbt-benchmark/ — and nothing else. It BUILDS AND
# DEPLOYS; it measures nothing, reads no Fabric endpoint, spends no capacity and commits nothing.
#
#   dashboard/build.mjs -> site/index.html   the SHELL, which carries no data
#                       -> dashboard.html    the artifact copy, with history/ inlined
#
# **PUBLISHING HAPPENS WHEN THE PAGE CHANGES, AND ONLY THEN.** `site/index.html` holds the stylesheet
# and `dashboard/app.js` and NOTHING ELSE: it reads `history/runs/*.json` and `history/cu.json` from
# `raw.githubusercontent.com` in the reader's browser on every load. So a `Benchmark` committing a
# record, or `Capacity units` committing the ledger, reaches readers with **no deploy at all** — and
# there is nothing left for this workflow to do about data. It used to hold the measurement too,
# which meant refreshing a number dragged a Pages deploy behind it.
#
#   Benchmark        builds, benchmarks, tears down, commits the run record   dispatch only
#   Capacity units   reads the metrics model, commits history/cu.json         schedule · dispatch · after Benchmark
#   Dashboard        this — builds and deploys the page                       push to dashboard/ · dispatch
#
# **TWO DIRECTORIES, AND THE SPLIT IS THE JOB EACH DOES.** `cu/` EXPORTS: it reads the Capacity
# Metrics model over DAX and writes `history/cu.json`, and that is all it does — Python, `requests`,
# no rendering. `dashboard/` PRESENTS: `app.js`, the shell it lives in, and the build that emits both
# copies of it — JavaScript, no network of its own beyond the two JSON documents it fetches. Neither
# imports the other and they share no file; what passes between them is `history/`, on disk and in
# git. Either can be deleted without touching the other.
#
# That is also why `render` is gone and there is no `dashboard.md`: `cu/dashboard.py` and
# `cu/report_html.py` were DELETED rather than kept beside `app.js`. Two implementations of the GUID
# join is exactly the drift the rest of this repo is built to avoid, so the browser's is the only one.
#
# **`push` HERE IS A REVERSAL OF "NOTHING RUNS ON PUSH", AND IT IS SAFE FOR A NARROW REASON.** That
# rule exists because the workflows that COMMIT would otherwise pay for their own commits. Check it
# against this file: `Dashboard` commits nothing — it deploys to Pages — and the path filter is
# `dashboard/**`, which never matches the `history/` paths that `Benchmark` and `Capacity units`
# write. So no commit can trigger a publish and no publish can make a commit: **the loop is not
# reachable.** The decision-making half of the old rule survives intact, just relocated — pushing a
# change to `dashboard/` IS the decision to publish it, and the page still never republishes because
# a number moved. Two things must stay true:
#
#   - `Benchmark` and `Capacity units` must NEVER gain a `push:` trigger. They commit, and one of
#     them spends capacity. The rule is now "nothing that commits or spends runs on push".
#   - `history/` must NEVER appear in the path filter below. That single edit builds the loop.
#
# `paths:` is evaluated PER PUSH, not per file — the same mechanic that made `paths-ignore` useless
# on Benchmark — so a commit touching `dashboard/app.js` and something else still fires this. On
# Benchmark that cost paid capacity; here it costs one no-op deploy of an identical shell.
# And the filter is deliberately the whole directory rather than the three files that actually reach
# the published bytes: if someone later adds `dashboard/theme.css` and forgets a narrow filter, the
# page SILENTLY stops updating, whereas the broad filter's worst case is a free deploy for a README
# edit.
on:
  push:
    branches: [main]
    paths: ['dashboard/**']   # NEVER add history/ — see above
  # The escape hatch: redeploy with no code change (a Pages settings change, a failed deploy, or the
  # one-time bootstrap after this trigger is first added — the commit that adds it touches no file
  # under `dashboard/`, so it does not fire itself).
  workflow_dispatch:

# cancel-in-progress earns its keep now that pushes drive this: a burst of commits to `dashboard/`
# cancels superseded deploys instead of queueing them, and a superseded publish has nothing worth
# finishing.
concurrency:
  group: dashboard-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Free, offline, and it CANNOT fail for a Fabric reason — no token, no Azure login, no Python, no
  # network beyond the checkout. It builds two HTML files out of the same `dashboard/app.js`:
  #
  #   site/index.html   the LIVE page. No data in it; it fetches `history/` on load.
  #   dashboard.html    the artifact copy, with `history/` inlined, for opening off a disk with no
  #                     network years later. Same module, same render path — which is the only reason
  #                     a frozen copy and the live page cannot disagree about a number.
  page:
    name: build the page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `ref:` still MATTERS, though the reason narrowed once the measurement moved out. A default
      # checkout takes `github.sha` — the triggering commit — and the OFFLINE SNAPSHOT would then be
      # frozen from the branch as it stood at that commit rather than from its head, so a ledger
      # commit landing in between would be missing from the artifact copy. The live page is immune:
      # it reads the branch head at view time, which is the whole point of the arrangement.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with: {node-version: "22"}

      # The whole join, the labelling rules and both charts, offline, in about a second. This is the
      # only gate on the page — there is no Python left in this job, which is what proves by running
      # that the render path reaches no network of its own.
      - name: Test the page offline
        run: node --test dashboard/app.test.mjs

      - name: Build the live page and the offline copy
        run: |
          set -euo pipefail
          node dashboard/build.mjs --out site/index.html
          node dashboard/build.mjs --out dashboard.html --snapshot
          # The dbt DAG, published beside the page. It is `dbt docs generate --static` output —
          # ONE self-contained file, manifest inlined, no sidecar JSON and no CDN — regenerated by
          # hand when the models change and committed under `dashboard/`, which is what makes a
          # regenerated DAG republish the page on its own with no new trigger.
          cp dashboard/dag.html site/dag.html
          # The live shell must not have picked up a snapshot: a page that ships its own data is a
          # page that goes stale silently, which is the whole failure this arrangement removes.
          grep -q '<script id="snapshot" type="application/json"></script>' site/index.html \
            || { echo "site/index.html carries inlined data — it must not" >&2; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dashboard.html
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Separate job because `deploy-pages` needs the `github-pages` environment. `needs: page` means a
  # build that failed cannot overwrite a good page with a half-written one.
  deploy:
    name: publish
    needs: page
    # NO `if:`. It used to carry a status function because a SKIPPED ancestor propagates past
    # `always()` — GitHub skips a job when any ancestor was skipped — and `measure` was skippable via
    # an input. With that job gone there is no skippable ancestor left, so the default `success()`
    # says exactly what is meant: a build that failed must not overwrite a good page.
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
