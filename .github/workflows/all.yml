name: Build and benchmark

# THE dispatch. Build the tables, query them through Direct Lake, delete everything the run created,
# and FILE ONE JSON RECORD.
#
#   open record → build (dbt.yml) → benchmark (benchmark.yml) → teardown → history/runs/<record>.json
#
# **IT READS NO CAPACITY UNITS.** That was a `lag` + `measure` stage on the end of this chain and it
# is gone. CU is the `Dashboard` workflow's business: it reads the metrics model by ITEM GUID, and
# the GUIDs are in the record this run commits. Splitting them is what makes each side simple — this
# one never waits for a metrics model, and the CU read never has to be re-run because a build was
# slow. Do not add a measure or a dashboard job here.
#
# The two called workflows are unchanged and still dispatchable on their own — this composes them,
# it does not replace them. Skipping a stage is an input, so a build-only dispatch spends no
# benchmark CU.
#
# **`workflow_dispatch` only, and that is the standing rule, not a default.** No `schedule`, no
# `push`, no `workflow_run`, no `repository_dispatch` — not here and not in the workflows this
# calls. The benchmark's query passes are interactive CU on shared capacity, which is the usage a
# capacity admin notices; a run nobody chose to start is the one that causes trouble. A
# `workflow_call` from here satisfies that rule because a human dispatched THIS.
on:
  workflow_dispatch:
    inputs:
      build:
        description: "run the dbt build (four engines, one landed copy of the data)"
        type: boolean
        default: true
      benchmark:
        description: "run the Direct Lake benchmark. Its query passes are what CREATE the analytics CU — with this off the report's analytics bars are empty, which is correct rather than broken."
        type: boolean
        default: true
      teardown:
        description: "DELETE every item this run created when it finishes — the output lakehouse/warehouse, dbt_dwh_src, the semantic model. ON BY DEFAULT, and it is what stops an idle item drawing background CU into the NEXT run's measurement. Never touches dbt_landing. Turn OFF only to keep a run's tables alive for debugging; the next build is then an incremental, which the record says."
        type: boolean
        default: true
      skip_download:
        description: "DON'T download new data — reuse the archive already landed. On by default, for the same reason: a growing input set makes two runs incomparable."
        type: boolean
        default: true
      cores:
        description: "Fabric Python-notebook vCores for the duckdb-family legs"
        type: choice
        options: ["4", "8", "16", "32", "64"]
        default: "8"
      spark_resource_profile:
        description: "spark leg only: writeHeavy = workspace default (no V-Order); readHeavyForPBI turns V-Order on"
        type: choice
        options: ["writeHeavy", "readHeavyForPBI", "readHeavyForSpark"]
        default: "writeHeavy"
      native_execution_engine:
        description: "spark leg only: Fabric Native Execution Engine"
        type: boolean
        default: false
      download_limit:
        description: "files to download per source, when skip_download is off"
        type: string
        default: "200"
      engines:
        description: "the engine to build AND benchmark. One per dispatch. Scopes THREE things: which build leg runs, which output item is created and torn down, and which semantic model the benchmark measures. The other three engines are not touched at all."
        # ONE ENGINE PER DISPATCH. A dropdown of the four names and nothing else — no combined
        # options, so a run always covers exactly one engine and the form cannot express more.
        # The value is still the string the called workflows take (they parse a comma-separated
        # list and always will), so nothing downstream changed to make this work.
        # Same shape as `cores` and `spark_resource_profile`: the dropdown lives here, on the
        # dispatch form, because workflow_call inputs CANNOT be `type: choice` — the called
        # workflows keep plain strings across that boundary.
        # Keep `dwh` first: GitHub preselects the first option, and `default:` must match one.
        # Consequence, stated because it is the point rather than a side effect: a four-engine
        # comparison is now four dispatches, and the cross-engine views assume one. The `layout`
        # table and the history record cover the single engine built, and the benchmark report has
        # one column, so it carries no ranking and no `x fastest`. `cu/dashboard.py` is what still
        # compares them: it composes the page from EVERY history record, keyed on (engine, config),
        # so four separate dispatches still land as four columns there.
        type: choice
        default: "dwh"
        options:
          - "dwh"
          - "duckrun"
          - "iceberg"
          - "spark"
      runs:
        description: "benchmark passes over the query suite. 1 cold, 2 warm, 3+ hot."
        type: string
        default: "6"
      think_seconds:
        description: "idle seconds between benchmark queries"
        type: string
        default: "4"
      gap_seconds:
        description: "idle seconds between benchmark engines"
        type: string
        default: "600"
      workspace:
        description: "Fabric workspace GUID. Blank = the FABRIC_WORKSPACE_ID repo secret, which is where it normally comes from."
        type: string
        default: ""

# Its own group: the called workflows keep `onelake-<ref>` between them, and they run in sequence
# here, so they queue behind each other rather than deadlocking. Not cancel-in-progress — a half
# finished build is worse than a queued one.
concurrency:
  group: all-${{ github.ref_name }}
  cancel-in-progress: false

# A called workflow can never hold MORE than its caller grants, so this is the union of what the
# stages need — not a wish list. `contents: write` is here for exactly one reason: the `record` job
# commits the run record. Without it the whole run fails to COMPILE (startup_failure, no jobs, no
# log), which reads like a broken file rather than a permission that is one level too low.
permissions:
  id-token: write     # OIDC to Fabric, every stage
  contents: write     # the `record` job commits history/runs/

jobs:
  # Free, and it opens the document everything else merges into. There is no CU floor to stamp any
  # more — the `Dashboard` workflow reads capacity by item GUID, and the GUIDs arrive in the record
  # this job starts.
  open:
    name: open the record
    runs-on: ubuntu-latest
    env:
      RUN_RECORD: ${{ github.workspace }}/record/record-00-run.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      # Seeds the run block of the record every later stage merges into: the run id, the sha, the
      # engine, and the dispatch inputs. `full_load` is NOT set here — it is derived at the end from
      # whether the output item was actually created fresh, which is a fact rather than the
      # intention an input states.
      - name: Open this run's record
        env:
          RUN_ENGINE: ${{ inputs.engines }}
          RUNIN_CORES: ${{ inputs.cores }}
          RUNIN_SPARK_RESOURCE_PROFILE: ${{ inputs.spark_resource_profile }}
          RUNIN_NATIVE_EXECUTION_ENGINE: ${{ inputs.native_execution_engine }}
          RUNIN_SKIP_DOWNLOAD: ${{ inputs.skip_download }}
          RUNIN_DOWNLOAD_LIMIT: ${{ inputs.download_limit }}
          RUNIN_TEARDOWN: ${{ inputs.teardown }}
          RUNIN_RUNS: ${{ inputs.runs }}
          RUNIN_THINK_SECONDS: ${{ inputs.think_seconds }}
          RUNIN_GAP_SECONDS: ${{ inputs.gap_seconds }}
        run: python .github/scripts/record.py init
      - uses: actions/upload-artifact@v4
        with:
          name: record-fragment-00-run
          path: record/
          if-no-files-found: error

  build:
    name: build
    needs: open
    if: inputs.build
    uses: ./.github/workflows/dbt.yml
    secrets: inherit
    with:
      workspace: ${{ inputs.workspace }}
      engines: ${{ inputs.engines }}
      skip_download: ${{ inputs.skip_download }}
      download_limit: ${{ inputs.download_limit }}
      cores: ${{ inputs.cores }}
      native_execution_engine: ${{ inputs.native_execution_engine }}
      spark_resource_profile: ${{ inputs.spark_resource_profile }}

  # `always()` so a skipped build does not skip the benchmark, but `!failure() && !cancelled()` so a
  # FAILED build does: benchmarking tables that did not finish writing measures nothing.
  benchmark:
    name: benchmark
    needs: [open, build]
    if: inputs.benchmark && !failure() && !cancelled()
    uses: ./.github/workflows/benchmark.yml
    secrets: inherit
    with:
      workspace: ${{ inputs.workspace }}
      engines: ${{ inputs.engines }}
      runs: ${{ inputs.runs }}
      think_seconds: ${{ inputs.think_seconds }}
      gap_seconds: ${{ inputs.gap_seconds }}

  # DELETE EVERYTHING THIS RUN CREATED, except dbt_landing. The output lakehouse or warehouse,
  # dbt_dwh_src, and the benchmark's semantic model; the throwaway notebook has already deleted
  # itself in fabric_run.py.
  #
  # Why, and it is not tidiness: an item that outlives its run keeps drawing background CU — OneLake
  # bills reads against an idle lakehouse, and a Direct Lake model gets refreshed — which lands in
  # the NEXT dispatch's measurement window with nothing in the capacity data to say it came from an
  # older generation. On run 30699626723 that was 1,578 CU for an iceberg item the dispatch had not
  # even selected.
  #
  # It deletes BY GUID, from this run's own merged record, so it can only ever remove what this run
  # created — a name-driven teardown would happily delete an item a concurrent dispatch had just
  # made, and there is no undo.
  #
  # ORDER IS LOAD-BEARING: after `build` (whose `layout` job reads every table through the Delta log)
  # and after `benchmark` (which queries them), because both read what this deletes. `always()`, so
  # a failed leg still gets cleaned up — a broken run that leaves a lakehouse standing is the worst
  # case for both the bill and the next measurement.
  teardown:
    name: delete this run's items
    needs: [open, build, benchmark]
    if: ${{ always() && inputs.teardown }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      WS_ID: ${{ inputs.workspace || secrets.FABRIC_WORKSPACE_ID }}
      RUN_RECORD: ${{ github.workspace }}/record/record-50-teardown.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install duckrun requests
      - name: Collect what this run created
        uses: actions/download-artifact@v4
        with:
          pattern: record-fragment-*
          path: fragments
      # Merged into a scratch record first: the items are spread across one fragment per job, and
      # the teardown has to see all of them. This copy is thrown away — the `record` job below
      # re-merges everything including the deletions this writes.
      - name: Delete them
        run: |
          set -euo pipefail
          python .github/scripts/record.py combine fragments "$RUNNER_TEMP/sofar.json"
          python .github/scripts/provision.py teardown "$RUNNER_TEMP/sofar.json"
      # always(): a partial teardown still deleted things, and the record has to say which.
      - name: Upload the run-record fragment
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: record-fragment-50-teardown
          path: record/
          if-no-files-found: ignore

  # ONE JSON per dispatch, and it is the point of the whole chain. Every stage wrote a fragment
  # naming the Fabric items it created under their GUIDs; this merges them, folds in the layout and
  # the benchmark's raw timings, and commits the result.
  #
  # The GUID is why this exists. Before it, CU could only be attributed by matching item DISPLAY
  # NAMES — which is why `cu/` carried a substring matcher, a lagging `'Items'` snapshot join and a
  # `shared` column for everything it could not name. A run that writes down what it created, and
  # then deletes it, makes every GUID belong to exactly one run.
  #
  # `always()`: a failed leg still created items, and their CU still has to be attributable to
  # something. A record of a broken run is worth more than no record.
  record:
    name: record the run
    needs: [open, build, benchmark, teardown]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      # Every fragment every job uploaded. `merge-multiple: false` (the default) nests each artifact
      # in its own directory, which is exactly why record.py sorts by BASENAME — the numeric prefix
      # is the merge order and the directory names would destroy it.
      - name: Collect the fragments
        uses: actions/download-artifact@v4
        with:
          pattern: record-fragment-*
          path: fragments

      # The benchmark's own document, folded in whole under `benchmark`. Raw timings, no analysis:
      # ms per pass per query per model, which is what the page derives from. Best-effort — a
      # build-only dispatch has no benchmark and the record simply has no `benchmark` key.
      - name: Collect the benchmark report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: run-report
          path: bench

      - name: Merge into one record
        id: rec
        run: |
          set -euo pipefail
          out="history/runs/$(date -u +%Y-%m-%dT%H%MZ)-${{ github.run_id }}.json"
          mkdir -p history/runs
          python .github/scripts/record.py finish fragments bench/run_report.json "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: run-record
          path: ${{ steps.rec.outputs.path }}
          if-no-files-found: error

      # Committing from CI is safe in THIS repo precisely because nothing runs on push — that
      # standing rule is what stops a bot commit from starting a paid build. If any workflow is ever
      # given a `push:` trigger, revisit this step in the same change.
      - name: Commit the record
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.rec.outputs.path }}"
          git diff --cached --quiet && { echo "record identical to HEAD" >&2; exit 0; }
          git commit -m "record: run ${{ github.run_id }} (${{ inputs.engines }})"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
